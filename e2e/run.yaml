init:
  - appPath: '$params.appPath?$params.appPath:$WorkingDirectory(..)'
  - generatedRunId: $FormatTime('now In UTC', 'yyyyMMddHHmmssSSS')
  - runId: '$params.runId?$params.runId:$generatedRunId'
  - runDir: ${appPath}/.data/e2e/${runId}
  - target:
      URL: ssh://localhost/
  - {name: portOffset, from: params.portOffset, value: 0}
  - defaultFixtureBinary: ${appPath}/.data/e2e/bin/fixture
  - offsetFixtureBinary: ${appPath}/.data/e2e/bin/fixture-${portOffset}
  - name: fixtureBinary
    from: offsetFixtureBinary
    when: '$in.portOffset > 0'
    else: $defaultFixtureBinary
  - ownerToken: ${runDir}/owner.token
  - editorToken: ${runDir}/editor.token
  - viewerToken: ${runDir}/viewer.token
  - outsiderToken: ${runDir}/outsider.token
pipeline:
  cleanupPrevious:
    action: process:stop
    target: $target
    input: $fixtureBinary
  fixturePorts:
    action: exec:run
    target: $target
    strictCompletion: true
    checkError: true
    commands:
      - |
        (
        set -eu
        command -v lsof >/dev/null
        test '${portOffset}' -ge 0 && test '${portOffset}' -le 46000
        echo "E2E_BROWSER_PORT=$((18780 + ${portOffset}))"
        echo "E2E_MCP_PORT=$((18790 + ${portOffset}))"
        echo "E2E_IDP_PORT=$((18795 + ${portOffset}))"
        echo "E2E_WEBDRIVER_PORT=$((4445 + ${portOffset}))"
        for fixture_port in $((18780 + ${portOffset})) $((18790 + ${portOffset})) $((18795 + ${portOffset})) $((4445 + ${portOffset})) $((18781 + ${portOffset})) $((18782 + ${portOffset})); do
          if lsof -nP -iTCP:$fixture_port -sTCP:LISTEN >/dev/null; then echo "e2e port is already occupied: $fixture_port" >&2; exit 1; fi
        done
        )
    extract:
      - {key: browserPort, regExpr: 'E2E_BROWSER_PORT=([0-9]+)', required: true}
      - {key: nativePort, regExpr: 'E2E_MCP_PORT=([0-9]+)', required: true}
      - {key: idpPort, regExpr: 'E2E_IDP_PORT=([0-9]+)', required: true}
      - {key: webdriverPort, regExpr: 'E2E_WEBDRIVER_PORT=([0-9]+)', required: true}
    post:
      webdriverSessionID: localhost:${Data.webdriverPort}
      nativeMCP: http://127.0.0.1:${Data.nativePort}/mcp
      browserURL: http://127.0.0.1:${Data.browserPort}
  nativeReleaseMySQL:
    action: run
    request: '@local/release-mysql'
  unifiedHost:
    action: run
    request: '@local/unified'
  build:
    action: exec:run
    target: $target
    strictCompletion: true
    checkError: true
    timeoutMs: 900000
    commands:
      - cd ${appPath}
      - mkdir -p .data/e2e/bin
      - CGO_ENABLED=0 GOWORK=off go build -o ${fixtureBinary} ./e2e/cmd/fixture
      - cd ui
      - npm ci --no-audit --no-fund
      - npm run build
  setup:
    prepare:
      action: exec:run
      target: $target
      strictCompletion: true
      checkError: true
      commands:
        - cd ${appPath}
        - ${fixtureBinary} -mode prepare -root ${appPath} -dir ${runDir} -port-offset ${portOffset}
    tokens:
      action: run
      request: '@sign-tokens'
    identityFixtures:
      action: exec:run
      target: $target
      strictCompletion: true
      checkError: true
      commands:
        - ${fixtureBinary} -mode prepare-idp -root ${appPath} -dir ${runDir} -port-offset ${portOffset}
    idp:
      action: http/endpoint:listen
      host: 127.0.0.1
      port: $idpPort
      replace: true
      rotate: true
      indexKeys: [Method, URL, Header.Authorization]
      baseDirectory: ${runDir}/idp
    consumer:
      action: dsunit:init
      datastore: consumer
      config:
        driver: sqlite
        dsn: ${runDir}/consumer.db
      scripts:
        - URL: ${appPath}/e2e/fixtures/consumer/schema.sql
    dictionary:
      action: dsunit:prepare
      datastore: consumer
      URL: ${appPath}/e2e/fixtures/consumer/dictionary
    dictionaryDatabase:
      action: dsunit:init
      datastore: lookup
      config:
        driver: sqlite
        dsn: ${runDir}/dictionary.db
      scripts:
        - URL: ${appPath}/e2e/fixtures/lookup/schema.sql
    dictionaryRows:
      action: dsunit:prepare
      datastore: lookup
      URL: ${appPath}/e2e/fixtures/lookup/dictionary
    studio:
      action: dsunit:register
      datastore: studio
      config:
        driver: sqlite
        dsn: ${runDir}/studio.db
    app:
      action: process:start
      target: $target
      directory: $appPath
      command: $fixtureBinary
      # process:start builds a shell command; detach output from its launch pipes.
      arguments: [-mode, serve, -root, $appPath, -dir, $runDir, -port-offset, $portOffset, '>', '${runDir}/fixture.log', '2>&1']
      immuneToHangups: true
    wait:
      action: exec:run
      target: $target
      strictCompletion: true
      checkError: true
      timeoutMs: 40000
      commands:
        - ${fixtureBinary} -mode wait -root ${appPath} -dir ${runDir} -port-offset ${portOffset}
    healthcheck:
      action: http/runner:send
      requests:
        - URL: ${browserURL}/health
          method: GET
          expect:
            Code: 200
            JSONBody:
              status: ready
  setupBrowser:
    prepareDriver:
      action: run
      request: '@local/prepare-webdriver'
    startDriver:
      action: webdriver:start
      URL: ${appPath}/.data/e2e/webdriver
      driver: chromedriver
      capabilities: ["--window-size=1440,1000"]
      port: $webdriverPort
  audit:
    action: run
    request: '@audit'
  test:
    action: run
    request: '@regression/regression'
  stop:
    action: process:stop
    target: $target
    input: $fixtureBinary
