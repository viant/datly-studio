# Endly uses SCY signing, matching Platform e2e. Never print tokens.
pipeline:
  sign0:
    action: secret:signJWT
    expiryInSec: 7200
    privateKey:
      URL: ${runDir}/private.pem
    claimsURL: ${runDir}/claims/owner.json
  save0:
    init:
      jwtToken: $sign0.TokenString
    action: storage:upload
    sourceKey: jwtToken
    mode: 384
    dest:
      URL: ${runDir}/owner.token
  sign1:
    action: secret:signJWT
    expiryInSec: 7200
    privateKey:
