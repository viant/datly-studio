pipeline:
  createNamespaceInUI:
    action: webdriver:run
    sessionID: localhost:4445
    autoStart: false
    browser: chrome
    failureArtifacts:
      directory: ${runDir}/artifacts/${caseName}
    commands:
      - page.goto("${browserURL}")
      - page.locator(".studio-nav-namespaces").click()
      - page.locator(".studio-namespace-actions .studio-catalog-primary-actions button[type='button']").click()
      - page.getByLabel("Namespace").fill("${caseName}")
      - expect(page.getByLabel("Namespace")).toHaveValue("${caseName}",15000)
      - page.getByLabel("Display title").fill("${caseName}")
      - expect(page.getByLabel("Namespace")).toHaveValue("${caseName}",15000)
      - page.getByLabel("Visibility").selectOption("public")
      - page.getByLabel("Expose MCP").check()
      - page.getByRole("button", "Create namespace").click()
      - expect(page.locator(".bp6-dialog")).toHaveCount(0,15000)
  namespace:
    action: mcp/runner:call
    url: $nativeMCP
    bearerTokenSecret: $ownerToken
    '@name': studio.sdk.namespaces.get
    arguments:
      name: $caseName
  createComponentInUI:
    action: webdriver:run
    sessionID: localhost:4445
    autoStart: false
    browser: chrome
    failureArtifacts:
      directory: ${runDir}/artifacts/${caseName}
    commands:
      - expect(page.getByLabel("Current namespace")).toBeEnabled(15000)
      - page.getByLabel("Current namespace").selectOption("${namespace.StructuredContent.namespaceId}")
      - expect(page.getByLabel("Current namespace")).toHaveValue("${namespace.StructuredContent.namespaceId}",15000)
      - page.locator(".studio-nav-connectors").click()
      - page.locator(".studio-catalog-primary-actions button[type='button']").click()
      - page.getByLabel("Name").fill("${caseName}")
      - page.getByLabel("Provider").selectOption("sqlite")
      - page.getByLabel("DSN template").fill("${runDir}/consumer.db")
      - page.getByRole("button", "Create connector").click()
      - expect(page.locator(".bp6-dialog")).toHaveCount(0,15000)
      - page.getByLabel("Search connectors").fill("${caseName}")
      - page.getByLabel("Search connectors").press("Enter")
      - page.locator("xpath://tr[.//*[normalize-space(.)='${caseName}']]//button[@aria-label='Test connector']").click()
      - page.locator("xpath://tr[.//*[normalize-space(.)='${caseName}']]//button[@aria-label='Activate connector']").click()
      - page.locator(".studio-nav-schema").click()
      - page.getByLabel("Connector").selectOption("${caseName}")
      - page.locator("xpath://button[@role='treeitem'][.//strong[normalize-space(.)='${caseName}_records']]").click()
      - page.getByRole("button", "Add as root view").click()
      - page.getByLabel("Component title").fill("${caseTitle}")
      - page.getByLabel("Slug").fill("${caseSlug}")
      - page.getByLabel("Root view identifier").fill("record")
      - page.getByRole("button", "Create component").click()
      - expect(page.getByRole("button", "Edit component")).toBeVisible(15000)
  components:
    action: mcp/runner:call
    url: $nativeMCP
    bearerTokenSecret: $ownerToken
    '@name': studio.sdk.components.list
    arguments:
      namespaceId: $namespace.StructuredContent.namespaceId
      limit: 10
  oneComponent:
    action: validator:assert
    normalizeKVPairs: true
    actual: $components.StructuredContent
    expect:
      '@length@items': 1
      items:
        - title: $caseTitle
  graphInUI:
    action: webdriver:run
    sessionID: localhost:4445
    autoStart: false
    browser: chrome
    failureArtifacts:
      directory: ${runDir}/artifacts/${caseName}
    commands:
      - page.locator(".studio-nav-schema").click()
      - page.getByLabel("Connector").selectOption("${caseName}")
      - page.locator("xpath://button[@role='treeitem'][.//strong[normalize-space(.)='${caseName}_contact']]").click()
      - page.getByRole("button", "Add as subview").click()
      - page.getByLabel("Component").selectOption("${components.StructuredContent.items[0].id}")
      - page.getByLabel("Child view identifier").fill("contact")
      - page.getByLabel("Parent view").selectOption("record")
      - page.getByLabel("Relation keys").fill("contact.record_id=record.id")
      - page.getByRole("button", "Compile and open").click()
      - expect(page.locator(".bp6-dialog")).toHaveCount(0,15000)
      - page.locator(".studio-nav-schema").click()
      - page.getByLabel("Connector").selectOption("${caseName}")
      - page.locator("xpath://button[@role='treeitem'][.//strong[normalize-space(.)='${caseName}_order']]").click()
      - page.getByRole("button", "Add as subview").click()
      - page.getByLabel("Component").selectOption("${components.StructuredContent.items[0].id}")
      - page.getByLabel("Child view identifier").fill("purchase")
      - page.getByLabel("Parent view").selectOption("record")
      - page.getByLabel("Relation keys").fill("purchase.record_id=record.id")
      - page.getByRole("button", "Compile and open").click()
      - expect(page.locator(".bp6-dialog")).toHaveCount(0,15000)
      - page.locator(".studio-nav-schema").click()
      - page.getByLabel("Connector").selectOption("${caseName}")
      - page.locator("xpath://button[@role='treeitem'][.//strong[normalize-space(.)='${caseName}_note']]").click()
      - page.getByRole("button", "Add as subview").click()
      - page.getByLabel("Component").selectOption("${components.StructuredContent.items[0].id}")
      - page.getByLabel("Child view identifier").fill("note")
      - page.getByLabel("Parent view").selectOption("record")
      - page.getByLabel("Relation keys").fill("note.record_id=record.id")
      - page.getByRole("button", "Compile and open").click()
      - expect(page.locator(".bp6-dialog")).toHaveCount(0,15000)
      - page.getByRole("tab", "Inputs").click()
      - page.getByRole("button", "Add input").click()
      - page.getByLabel("Input name").fill("CustomerID")
      - page.getByLabel("Type expression").fill("int")
      - page.getByLabel("Kind source").fill("customerId")
      - page.locator(".studio-inline-contract-form button[type='submit']").click()
      - expect(page.locator(".studio-inline-contract-form")).toHaveCount(0,15000)
      - page.getByRole("tab", "Inputs").click()
      - page.locator("#reader-input-predicates-tab").click()
      - page.getByRole("button", "Add predicate").click()
      - page.getByLabel("Parameter").fill("CustomerID")
      - page.getByLabel("Target view").selectOption("record")
      - page.getByLabel("Predicate").selectOption("equal")
      - page.locator(".studio-predicate-arguments summary").click()
      - page.getByLabel("Predicate arguments").fill("${caseName}_records, id")
      - page.locator(".studio-inline-contract-form button[type='submit']").click()
      - expect(page.locator(".studio-inline-contract-form")).toHaveCount(0,15000)
      - page.getByRole("tab", "Inputs").click()
      - page.getByRole("button", "Add input").click()
      - page.getByLabel("Input name").fill("Name")
      - page.getByLabel("Type expression").fill("string")
      - page.getByLabel("Kind source").fill("name")
      - page.locator(".studio-inline-contract-form button[type='submit']").click()
      - expect(page.locator(".studio-inline-contract-form")).toHaveCount(0,15000)
      - page.getByRole("tab", "Inputs").click()
      - page.locator("#reader-input-predicates-tab").click()
      - page.getByRole("button", "Add predicate").click()
      - page.getByLabel("Parameter").fill("Name")
      - page.getByLabel("Target view").selectOption("record")
      - page.getByLabel("Predicate").selectOption("equal")
      - page.locator(".studio-predicate-arguments summary").click()
      - page.getByLabel("Predicate arguments").fill("${caseName}_records, name")
      - page.locator(".studio-inline-contract-form button[type='submit']").click()
      - expect(page.locator(".studio-inline-contract-form")).toHaveCount(0,15000)
      - page.getByRole("tab", "Inputs").click()
      - page.getByRole("button", "Add input").click()
      - page.getByLabel("Input name").fill("State")
      - page.getByLabel("Type expression").fill("string")
      - page.getByLabel("Kind source").fill("state")
      - page.locator(".studio-inline-contract-form button[type='submit']").click()
      - expect(page.locator(".studio-inline-contract-form")).toHaveCount(0,15000)
      - page.getByRole("tab", "Inputs").click()
      - page.locator("#reader-input-predicates-tab").click()
      - page.getByRole("button", "Add predicate").click()
      - page.getByLabel("Parameter").fill("State")
      - page.getByLabel("Target view").selectOption("record")
      - page.getByLabel("Predicate").selectOption("equal")
      - page.locator(".studio-predicate-arguments summary").click()
      - page.getByLabel("Predicate arguments").fill("${caseName}_records, state")
      - page.locator(".studio-inline-contract-form button[type='submit']").click()
      - expect(page.locator(".studio-inline-contract-form")).toHaveCount(0,15000)
      - page.getByRole("tab", "Inputs").click()
      - page.getByRole("button", "Add input").click()
      - page.getByLabel("Input name").fill("Score")
      - page.getByLabel("Type expression").fill("int")
      - page.getByLabel("Kind source").fill("score")
      - page.locator(".studio-inline-contract-form button[type='submit']").click()
      - expect(page.locator(".studio-inline-contract-form")).toHaveCount(0,15000)
      - page.getByRole("tab", "Inputs").click()
      - page.locator("#reader-input-predicates-tab").click()
      - page.getByRole("button", "Add predicate").click()
      - page.getByLabel("Parameter").fill("Score")
      - page.getByLabel("Target view").selectOption("record")
      - page.getByLabel("Predicate").selectOption("equal")
      - page.locator(".studio-predicate-arguments summary").click()
      - page.getByLabel("Predicate arguments").fill("${caseName}_records, score")
      - page.locator(".studio-inline-contract-form button[type='submit']").click()
      - expect(page.locator(".studio-inline-contract-form")).toHaveCount(0,15000)
  authorInUI:
    action: webdriver:run
    sessionID: localhost:4445
    autoStart: false
    browser: chrome
    failureArtifacts:
      directory: ${runDir}/artifacts/${caseName}
    commands:
      - page.getByRole("button", "Edit component").click()
      - page.getByLabel("Enable MCP tool").check()
      - page.getByLabel("Canonical MCP tool name").fill("${caseTool}")
      - page.getByRole("button", "Save component").click()
      - expect(page.locator(".bp6-dialog")).toHaveCount(0,15000)
      - page.getByRole("button", "Validate").click()
      - page.getByRole("button", "Validate revision").click()
      - expect(page.getByText("Runtime contract is ready")).toBeVisible(15000)
      - page.locator("xpath://div[contains(@class,'bp6-dialog-footer-actions')]//button[normalize-space(.)='Close']").click()
  policyInUI:
    action: webdriver:run
    sessionID: localhost:4445
    autoStart: false
    browser: chrome
    failureArtifacts:
      directory: ${runDir}/artifacts/${caseName}
    commands: $policyCommands
  closeEditor:
    action: webdriver:run
    sessionID: localhost:4445
    autoStart: false
    browser: chrome
    commands:
      - page.locator(".studio-nav-namespaces").click()
      - expect(page.getByLabel("Current namespace")).toBeEnabled(15000)
  versions:
    action: mcp/runner:call
    url: $nativeMCP
    bearerTokenSecret: $ownerToken
    '@name': studio.sdk.versions.list
    arguments:
      namespaceId: $namespace.StructuredContent.namespaceId
      reportId: $components.StructuredContent.items[0].id
  validated:
    action: validator:assert
    normalizeKVPairs: true
    actual: $versions.StructuredContent.items[0].compileStatus
    expect: valid
  runtime:
    action: mcp/runner:call
    url: $nativeMCP
    bearerTokenSecret: $ownerToken
    '@name': studio.sdk.runtime.status
    arguments:
      namespaceId: $namespace.StructuredContent.namespaceId
    allowToolError: true
    repeat: 50
    thinkTimeMs: 100
    exit: $output:/"status":"ready"/
  runtimeReady:
    action: validator:assert
    normalizeKVPairs: true
    actual: $runtime.StructuredContent.host.status
    expect: ready
  publish:
    action: mcp/runner:call
    url: $nativeMCP
    bearerTokenSecret: $ownerToken
    '@name': studio.sdk.publications.publish
    arguments:
      namespaceId: $namespace.StructuredContent.namespaceId
      reportId: $components.StructuredContent.items[0].id
      versionNo: $versions.StructuredContent.items[0].versionNo
      input:
        expectedSourceRevision: $versions.StructuredContent.items[0].sourceRevision
  published:
    action: validator:assert
    normalizeKVPairs: true
    actual: $publish.StructuredContent.status
    expect: active
  endpoint:
    action: mcp/runner:call
    url: $nativeMCP
    bearerTokenSecret: $ownerToken
    '@name': studio.sdk.runtime.status
    arguments:
      namespaceId: $namespace.StructuredContent.namespaceId
  allowedCatalog:
    action: mcp/runner:listTools
    url: $endpoint.StructuredContent.host.mcpUrl
    bearerTokenSecret: ${runDir}/${allowedUser}.token
  allowedTool:
    action: validator:assert
    normalizeKVPairs: true
    actual: $allowedCatalog
    expect:
      '@length@Tools': 1
      Tools:
        - Name: ${caseTool}
  invokeAllowed:
    action: mcp/runner:call
    url: $endpoint.StructuredContent.host.mcpUrl
    bearerTokenSecret: ${runDir}/${allowedUser}.token
    '@name': ${caseTool}
    arguments: {}
  returnedData:
    action: validator:assert
    normalizeKVPairs: true
    actual: $invokeAllowed
    expect:
      IsError: false
      StructuredContent:
        '@length@records': 2
        records:
          - id: 10
            name: ${caseName} first
            contact:
              - id: 101
                detail: first detail
            purchase:
              - id: 102
                amount: 120
            note:
              - id: 103
                message: first note
          - id: 20
            name: ${caseName} second
  deniedCatalog:
    action: mcp/runner:listTools
    url: $endpoint.StructuredContent.host.mcpUrl
    bearerTokenSecret: ${runDir}/${deniedUser}.token
  hiddenTool:
    action: validator:assert
    normalizeKVPairs: true
    actual: $deniedCatalog
    expect:
      '@length@Tools': 0
  invokeDenied:
    action: mcp/runner:call
    url: $endpoint.StructuredContent.host.mcpUrl
    bearerTokenSecret: ${runDir}/${deniedUser}.token
    '@name': ${caseTool}
    arguments: {}
    allowProtocolError: true
    allowToolError: true
  directDenied:
    action: validator:assert
    normalizeKVPairs: true
    actual: $invokeDenied
    expect:
      IsError: true
      ProtocolErrorCode: -32600
  filterCustomerID:
    action: mcp/runner:call
    url: $endpoint.StructuredContent.host.mcpUrl
    bearerTokenSecret: ${runDir}/${allowedUser}.token
    '@name': ${caseTool}
    arguments:
      CustomerID: 10
  verifyCustomerID:
    action: validator:assert
    normalizeKVPairs: true
    actual: $filterCustomerID
    expect:
      IsError: false
      StructuredContent:
        '@length@records': 1
        records:
          - id: 10
            name: ui_complex first
  filterName:
    action: mcp/runner:call
    url: $endpoint.StructuredContent.host.mcpUrl
    bearerTokenSecret: ${runDir}/${allowedUser}.token
    '@name': ${caseTool}
    arguments:
      Name: ui_complex first
  verifyName:
    action: validator:assert
    normalizeKVPairs: true
    actual: $filterName
    expect:
      IsError: false
      StructuredContent:
        '@length@records': 1
        records:
          - id: 10
            name: ui_complex first
  filterState:
    action: mcp/runner:call
    url: $endpoint.StructuredContent.host.mcpUrl
    bearerTokenSecret: ${runDir}/${allowedUser}.token
    '@name': ${caseTool}
    arguments:
      State: active
  verifyState:
    action: validator:assert
    normalizeKVPairs: true
    actual: $filterState
    expect:
      IsError: false
      StructuredContent:
        '@length@records': 1
        records:
          - id: 10
            name: ui_complex first
  filterScore:
    action: mcp/runner:call
    url: $endpoint.StructuredContent.host.mcpUrl
    bearerTokenSecret: ${runDir}/${allowedUser}.token
    '@name': ${caseTool}
    arguments:
      Score: 90
  verifyScore:
    action: validator:assert
    normalizeKVPairs: true
    actual: $filterScore
    expect:
      IsError: false
      StructuredContent:
        '@length@records': 1
        records:
          - id: 10
            name: ui_complex first
  firstPublishedVersion:
    action: validator:assert
    actual: $endpoint.StructuredContent.readers[0].versionNo
    expect: 1
  editRevisionInUI:
    action: webdriver:run
    sessionID: localhost:4445
    autoStart: false
    browser: chrome
    failureArtifacts:
      directory: ${runDir}/artifacts/${caseName}
    commands:
      - page.locator(".studio-nav-components").click()
      - page.getByRole("button", "Open Reader Builder").click()
      - page.getByRole("button", "Create editable draft").click()
      - expect(page.getByRole("button", "Edit component")).toBeVisible(15000)
      - page.locator(".studio-view-select[title='Contact']").click()
      - page.getByRole("button", "Manage columns").click()
      - page.locator("xpath://div[contains(@class,'studio-column-dialog')]//button[.//strong[translate(normalize-space(.),'ABCDEFGHIJKLMNOPQRSTUVWXYZ','abcdefghijklmnopqrstuvwxyz')='detail']]").click()
      - page.getByLabel("Output visibility").selectOption("hidden")
      - page.getByRole("button", "Save column contract").click()
      - expect(page.locator(".bp6-dialog")).toHaveCount(0,15000)
      - page.getByRole("tab", "Inputs").click()
      - page.getByRole("button", "Add input").click()
      - page.getByLabel("Input name").fill("Region")
      - page.getByLabel("Type expression").fill("string")
      - page.getByLabel("Kind source").fill("region")
      - page.locator(".studio-inline-contract-form button[type='submit']").click()
      - expect(page.locator(".studio-inline-contract-form")).toHaveCount(0,15000)
      - page.getByRole("tab", "Inputs").click()
      - page.locator("#reader-input-predicates-tab").click()
      - page.getByRole("button", "Add predicate").click()
      - page.getByLabel("Parameter").fill("Region")
      - page.getByLabel("Target view").selectOption("record")
      - page.getByLabel("Predicate").selectOption("equal")
      - page.locator(".studio-predicate-arguments summary").click()
      - page.getByLabel("Predicate arguments").fill("${caseName}_records, region")
      - page.locator(".studio-inline-contract-form button[type='submit']").click()
      - expect(page.locator(".studio-inline-contract-form")).toHaveCount(0,15000)
      - page.getByRole("tab", "Inputs").click()
      - page.getByRole("button", "Add input").click()
      - page.getByLabel("Input name").fill("ContactLabel")
      - page.getByLabel("Type expression").fill("string")
      - page.getByLabel("Kind source").fill("contactLabel")
      - page.locator(".studio-inline-contract-form button[type='submit']").click()
      - expect(page.locator(".studio-inline-contract-form")).toHaveCount(0,15000)
      - page.getByRole("tab", "Inputs").click()
      - page.locator("#reader-input-predicates-tab").click()
      - page.getByRole("button", "Add predicate").click()
      - page.getByLabel("Parameter").fill("ContactLabel")
      - page.getByLabel("Target view").selectOption("contact")
      - page.locator(".studio-predicate-options summary").click()
      - page.getByLabel("Group").fill("2")
      - page.getByLabel("Predicate").selectOption("equal")
      - page.locator(".studio-predicate-arguments summary").click()
      - page.getByLabel("Predicate arguments").fill("${caseName}_contact, label")
      - page.locator(".studio-inline-contract-form button[type='submit']").click()
      - expect(page.locator(".studio-inline-contract-form")).toHaveCount(0,15000)
      - page.getByRole("button", "Validate").click()
      - page.getByRole("button", "Validate revision").click()
      - expect(page.getByText("Runtime contract is ready")).toBeVisible(15000)
      - page.locator("xpath://div[contains(@class,'bp6-dialog-footer-actions')]//button[normalize-space(.)='Close']").click()
  policyForSecondRevisionInUI:
    action: webdriver:run
    sessionID: localhost:4445
    autoStart: false
    browser: chrome
    failureArtifacts:
      directory: ${runDir}/artifacts/${caseName}
    commands:
      - page.locator(".studio-nav-security").click()
      - page.getByLabel("Find a resource").fill("${caseTitle}")
      - page.getByRole("button", "${caseTitle}").click()
      - expect(page.locator(".studio-resource-access-heading .bp6-tag")).toHaveText("Policy revision 1",15000)
      - expect(page.locator(".studio-resource-access-heading")).toContainText("version 2",15000)
      - page.locator(".studio-nav-namespaces").click()
  secondVersions:
    action: mcp/runner:call
    url: $nativeMCP
    bearerTokenSecret: $ownerToken
    '@name': studio.sdk.versions.list
    arguments:
      namespaceId: $namespace.StructuredContent.namespaceId
      reportId: $components.StructuredContent.items[0].id
  secondDraft:
    action: validator:assert
    normalizeKVPairs: true
    actual: $secondVersions.StructuredContent.items[0]
    expect:
      versionNo: 2
      compileStatus: valid
  republish:
    action: mcp/runner:call
    url: $nativeMCP
    bearerTokenSecret: $ownerToken
    '@name': studio.sdk.publications.publish
    arguments:
      namespaceId: $namespace.StructuredContent.namespaceId
      reportId: $components.StructuredContent.items[0].id
      versionNo: 2
      input:
        expectedSourceRevision: $secondVersions.StructuredContent.items[0].sourceRevision
  secondPublication:
    action: validator:assert
    normalizeKVPairs: true
    actual: $republish.StructuredContent
    expect:
      status: active
      activeVersionNo: 2
  secondCatalog:
    action: mcp/runner:listTools
    url: $endpoint.StructuredContent.host.mcpUrl
    bearerTokenSecret: ${runDir}/${allowedUser}.token
  secondSchema:
    action: validator:assert
    normalizeKVPairs: true
    actual: $secondCatalog
    expect:
      '@length@Tools': 1
      Tools:
        - Name: ${caseTool}
          InputSchema:
            Properties:
              Region:
                type: string
              ContactLabel:
                type: string
  invokeSecondRevision:
    action: mcp/runner:call
    url: $endpoint.StructuredContent.host.mcpUrl
    bearerTokenSecret: ${runDir}/${allowedUser}.token
    '@name': ${caseTool}
    arguments:
      Region: east
      ContactLabel: secondary
  updatedResults:
    action: validator:assert
    normalizeKVPairs: true
    actual: $invokeSecondRevision
    expect:
      IsError: false
      StructuredContent:
        '@length@records': 1
        records:
          - id: 20
            name: ui_complex second
            '@length@contact': 1
            contact:
              - id: 201
                label: secondary
                '@exists@detail': false
            purchase:
              - id: 202
                amount: 240
            note:
              - id: 203
                message: second note
  originalAndNewPredicates:
    action: mcp/runner:call
    url: $endpoint.StructuredContent.host.mcpUrl
    bearerTokenSecret: ${runDir}/${allowedUser}.token
    '@name': ${caseTool}
    arguments:
      CustomerID: 10
      Name: ui_complex first
      State: active
      Score: 90
      Region: west
      ContactLabel: primary
  combinedResults:
    action: validator:assert
    normalizeKVPairs: true
    actual: $originalAndNewPredicates
    expect:
      IsError: false
      StructuredContent:
        '@length@records': 1
        records:
          - id: 10
            contact:
              - id: 101
                label: primary
                '@exists@detail': false
