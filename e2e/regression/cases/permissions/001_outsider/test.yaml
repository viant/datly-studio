pipeline:
  createConnector:
    action: mcp/runner:call
    url: $nativeMCP
    bearerTokenSecret: $ownerToken
    arguments:
      name: permissions
      driver: sqlite
      dsnTemplate: ${runDir}/consumer.db
    allowToolError: true
    '@name': studio.sdk.connectors.create
  createConnectorSucceeded:
    action: validator:assert
    normalizeKVPairs: true
    actual: $createConnector
    expect:
      IsError: false
  probe:
    action: mcp/runner:call
    url: $nativeMCP
    bearerTokenSecret: $ownerToken
    arguments:
      name: permissions
    allowToolError: true
    '@name': studio.sdk.connectors.test
  probeSucceeded:
    action: validator:assert
    normalizeKVPairs: true
    actual: $probe
    expect:
      IsError: false
  connector:
    action: mcp/runner:call
    url: $nativeMCP
    bearerTokenSecret: $ownerToken
    arguments:
      name: permissions
    allowToolError: true
    '@name': studio.sdk.connectors.get
  connectorSucceeded:
    action: validator:assert
    normalizeKVPairs: true
    actual: $connector
    expect:
      IsError: false
  activate:
    action: mcp/runner:call
    url: $nativeMCP
    bearerTokenSecret: $ownerToken
    arguments:
      name: permissions
      etag: $connector.StructuredContent.etag
    allowToolError: true
    '@name': studio.sdk.connectors.activate
  activateSucceeded:
    action: validator:assert
    normalizeKVPairs: true
    actual: $activate
    expect:
      IsError: false
  namespace:
    action: mcp/runner:call
    url: $nativeMCP
    bearerTokenSecret: $ownerToken
    arguments:
      name: permissions
      title: permissions
      mcpEnabled: true
      mcpPort: 0
    allowToolError: true
    '@name': studio.sdk.namespaces.create
  namespaceSucceeded:
    action: validator:assert
    normalizeKVPairs: true
    actual: $namespace
    expect:
      IsError: false
  component:
    action: mcp/runner:call
    url: $nativeMCP
    bearerTokenSecret: $ownerToken
    arguments:
      namespaceId: $namespace.StructuredContent.namespaceId
      title: permissions
      slug: permissions
      namespace: permissions
      defaultConnectorName: permissions
    allowToolError: true
    '@name': studio.sdk.components.create
  componentSucceeded:
    action: validator:assert
    normalizeKVPairs: true
    actual: $component
    expect:
      IsError: false
  import:
    action: mcp/runner:call
    url: $nativeMCP
    bearerTokenSecret: $ownerToken
    arguments:
      namespaceId: $namespace.StructuredContent.namespaceId
      reportId: $component.StructuredContent.id
      input:
        dql: |-
          #package('github.com/viant/datly-studio/dynamic/permissions')
          #setting($_ = $input_type('CustomerInput'))
          #setting($_ = $output_type('CustomerOutput'))
          #setting($_ = $case_format('lc'))
          #setting($_ = $connector('permissions'))
          #setting($_ = $route('/permissions', 'GET'))
          #setting($_ = $mcp('permissions.read','Read consumer customers'))
          #define($_ = $Rows<[]*Customer>(output/view))
          SELECT customers.*, type(customers,'Customer') FROM (SELECT c.id,c.tenant,c.name,c.active FROM customers c) customers
    allowToolError: true
    '@name': studio.sdk.versions.load_dql
  importSucceeded:
    action: validator:assert
    normalizeKVPairs: true
    actual: $import
    expect:
      IsError: false
  verifyImport:
    action: validator:assert
    actual: $import.StructuredContent.version
    expect:
      state: draft
      compileStatus: pending
    normalizeKVPairs: true
  denied:
    action: mcp/runner:call
    url: $nativeMCP
    bearerTokenSecret: $outsiderToken
    arguments:
      namespaceId: $namespace.StructuredContent.namespaceId
      id: $component.StructuredContent.id
    allowToolError: true
    '@name': studio.sdk.components.get
  assertDenied:
    action: validator:assert
    actual: $denied.IsError
    expect: true
    normalizeKVPairs: true
  persist:
    action: dsunit:query
    datastore: studio
    SQL: SELECT title FROM components WHERE slug='permissions'
    expect:
      - title: permissions
