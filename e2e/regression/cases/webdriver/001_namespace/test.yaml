pipeline:
  browser:
    action: webdriver:run
    browser: chrome
    failureArtifacts:
      directory: ${runDir}/artifacts/webdriver
    commands:
      - page.goto("${browserURL}")
      - page.getByRole("button", "Namespaces").click()
      - page.getByRole("button", "New namespace").click()
      - page.getByLabel("Namespace").fill("browsernamespace")
      - page.getByLabel("Display title").fill("Browser namespace")
      - page.getByRole("button", "Save").click()
      - expect(page.locator("xpath://td[normalize-space(.)='Browser namespace']")).toBeVisible(15000)
    sessionID: localhost:4445
    autoStart: false
  persist:
    action: dsunit:query
    datastore: studio
    SQL: SELECT name,title FROM namespaces WHERE name='browsernamespace'
    expect:
      - name: browsernamespace
        title: Browser namespace
