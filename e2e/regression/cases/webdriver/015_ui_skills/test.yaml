---
init:
  caseTool: owner.ui.catalog.read
  caseName: ui_catalog
  caseTable: ui_catalog_records
  caseDataName: ui_catalog
  caseTitle: Catalog component
  caseSlug: ui-catalog
  allowedUser: no-exposure
  deniedUser: no-role
  policyCommands:
  - page.goto("${browserURL}")
  - page.locator(".studio-nav-security").click()
  - page.getByLabel("Find a resource").fill("${caseTitle}")
  - page.getByRole("button", "Search resources").click()
  - page.locator("xpath://tr[.//*[normalize-space(.)='${caseTitle}']]//button[@aria-label='Open permissions']").click()
  - page.getByRole("button", "Create access policy").click()
  - expect(page.locator(".forge-resource-access-heading .bp6-tag")).toHaveText("Policy
    revision 0",15000)
  - page.locator("xpath://nav[@aria-label='Permission actions']//button[strong[normalize-space(.)='discover']]").click()
  - page.getByLabel("Access mode").selectOption("protected")
  - page.getByLabel("rule condition").selectOption("role")
  - page.getByLabel("rule value").selectOption("ROLE_ANALYST")
  - page.locator("xpath://nav[@aria-label='Permission actions']//button[strong[normalize-space(.)='describe']]").click()
  - page.getByLabel("Access mode").selectOption("protected")
  - page.getByLabel("rule condition").selectOption("role")
  - page.getByLabel("rule value").selectOption("ROLE_ANALYST")
  - page.locator("xpath://nav[@aria-label='Permission actions']//button[strong[normalize-space(.)='execute']]").click()
  - page.getByLabel("Access mode").selectOption("protected")
  - page.getByLabel("rule condition").selectOption("role")
  - page.getByLabel("rule value").selectOption("ROLE_ANALYST")
  - page.getByRole("button", "Review changes").click()
  - expect(page.locator(".bp6-dialog-container.bp6-overlay-enter-done .forge-resource-review-dialog")).toBeVisible(15000)
  - page.getByRole("button", "Save permissions").click()
  - expect(page.locator(".bp6-dialog")).toHaveCount(0,15000)
  - expect(page.locator(".forge-resource-access-footer [role='status']")).toHaveText("Permissions
    saved.",15000)
  namespaceSkillDocument: |
    ---
    name: namespace-guide
    description: Guide to this namespace.
    ---
    Use the customer tools in this namespace.
  componentSkillDocument: |
    ---
    name: component-guide
    description: Guide to the catalog component.
    ---
    Use ${caseTool} to read the catalog records.
pipeline:
  createNamespaceInUI:
    action: webdriver:run
    sessionID: localhost:4445
    autoStart: false
    browser: chrome
    failureArtifacts:
      directory: "${runDir}/artifacts/${caseName}"
    commands:
    - page.goto("${browserURL}")
    - page.locator(".studio-nav-namespaces").click()
    - page.getByRole("button", "New namespace").click()
    - page.getByLabel("Namespace").fill("${caseName}")
    - expect(page.getByLabel("Namespace")).toHaveValue("${caseName}",15000)
    - page.getByLabel("Display title").fill("${caseName}")
    - expect(page.getByLabel("Namespace")).toHaveValue("${caseName}",15000)
    - page.getByRole("button", "Visibility").click()
    - page.getByRole("menuitem", "Public").click()
    - page.getByLabel("Description").fill("UI-authored namespace and component skills")
    - page.getByRole("button", "Save").click()
    - expect(page.locator(".bp6-dialog")).toHaveCount(0,15000)
  namespace:
    action: mcp/runner:call
    url: "$nativeMCP"
    bearerTokenSecret: "$ownerToken"
    "@name": studio.sdk.namespaces.get
    arguments:
      name: "$caseName"
  namespaceSkillInUI:
    action: webdriver:run
    sessionID: localhost:4445
    autoStart: false
    browser: chrome
    failureArtifacts:
      directory: "${runDir}/artifacts/${caseName}"
    commands:
    - page.goto("${browserURL}")
    - page.getByLabel("Current namespace").selectOption("${namespace.StructuredContent.namespaceId}")
    - page.locator(".studio-nav-skills").click()
    - expect(page.getByRole("button", "New namespace skill")).toBeEnabled(15000)
    - page.getByRole("button", "New namespace skill").click()
    - page.getByLabel("Display title").fill("Namespace guide")
    - 'page.getByLabel("SKILL.md").fill("---\nname: namespace-guide\ndescription:
      Guide to this namespace.\n---\nUse the customer tools in this namespace.\n")'
    - page.getByRole("tab", "Supporting files").click()
    - page.getByRole("button", "Add supporting file").click()
    - page.getByLabel("Relative path").fill("references/query.md")
    - page.getByLabel("Content").fill("Read the catalog through the namespace MCP endpoint.")
    - page.getByRole("button", "Save supporting file").click()
    - page.getByRole("button", "Save namespace skill").click()
    - expect(page.locator("xpath://*[@role='status'][normalize-space(.)='Saved namespace-guide, revision 1.']")).toBeVisible(15000)
    - expect(page.getByRole("button", "Publish namespace skill")).toBeDisabled(15000)
  namespaceSkills:
    action: mcp/runner:call
    url: "$nativeMCP"
    bearerTokenSecret: "$ownerToken"
    "@name": studio.sdk.namespace_skills.list
    arguments:
      namespaceId: "$namespace.StructuredContent.namespaceId"
  independentNamespaceDraft:
    action: validator:assert
    normalizeKVPairs: true
    actual: "$namespaceSkills.StructuredContent"
    expect:
      "@length@items": 1
      items:
      - name: namespace-guide
        latestRevision: 1
        publishedRevision: 0
  zeroComponentsBeforeNamespaceSkill:
    action: dsunit:query
    datastore: studio
    SQL: SELECT COUNT(*) AS total FROM components WHERE namespace='${caseName}'
    expect:
    - total: 0
  enableNamespaceMCPInUI:
    action: webdriver:run
    sessionID: localhost:4445
    autoStart: false
    browser: chrome
    failureArtifacts:
      directory: "${runDir}/artifacts/${caseName}"
    commands:
    - page.goto("${browserURL}")
    - page.locator(".studio-nav-namespaces").click()
    - page.getByLabel("Find namespace").fill("${caseName}")
    - page.getByRole("button", "Search").click()
    - expect(page.locator("xpath://div[@data-forge-container-id='namespace-list']//tbody/tr")).toHaveCount(1,15000)
    - expect(page.getByRole("button", "Edit namespace")).toBeEnabled(15000)
    - page.getByRole("button", "Edit namespace").click()
    - page.getByLabel("Expose MCP").check()
    - page.getByRole("button", "Save").click()
    - expect(page.locator(".bp6-dialog")).toHaveCount(0,15000)
  namespaceReady:
    action: mcp/runner:call
    url: "$nativeMCP"
    bearerTokenSecret: "$ownerToken"
    "@name": studio.sdk.runtime.status
    arguments:
      namespaceId: "$namespace.StructuredContent.namespaceId"
    allowToolError: true
    repeat: 50
    thinkTimeMs: 100
    exit: $output:/"status":"ready"/
  namespaceMCPReady:
    action: validator:assert
    normalizeKVPairs: true
    actual: "$namespaceReady.StructuredContent.host.status"
    expect: ready
  publishNamespaceSkillInUI:
    action: webdriver:run
    sessionID: localhost:4445
    autoStart: false
    browser: chrome
    failureArtifacts:
      directory: "${runDir}/artifacts/${caseName}"
    commands:
    - page.locator(".studio-nav-skills").click()
    - expect(page.getByRole("button", "Publish namespace skill")).toBeEnabled(15000)
    - page.getByRole("button", "Publish namespace skill").click()
    - expect(page.locator("xpath://*[@role='status'][normalize-space(.)='Published namespace-guide, revision 1.']")).toBeVisible(15000)
  publishNamespaceSkill:
    action: mcp/runner:call
    url: "$nativeMCP"
    bearerTokenSecret: "$ownerToken"
    "@name": studio.sdk.namespace_skills.get
    arguments:
      namespaceId: "$namespace.StructuredContent.namespaceId"
      skillId: "$namespaceSkills.StructuredContent.items[0].skillId"
  namespaceSkillPublished:
    action: validator:assert
    normalizeKVPairs: true
    actual: "$publishNamespaceSkill.StructuredContent.skill.publishedRevision"
    expect: 1
  onlyNamespaceSkill:
    action: mcp/runner:listSkills
    url: "$namespaceReady.StructuredContent.host.mcpUrl"
    bearerTokenSecret: "$ownerToken"
  oneSkillWithoutComponents:
    action: validator:assert
    normalizeKVPairs: true
    actual: "$onlyNamespaceSkill"
    expect:
      "@length@Skills": 1
      Skills:
      - Frontmatter:
          name: namespace-guide
  createComponentInUI:
    action: webdriver:run
    sessionID: localhost:4445
    autoStart: false
    browser: chrome
    failureArtifacts:
      directory: "${runDir}/artifacts/${caseName}"
    commands:
    - expect(page.getByLabel("Current namespace")).toBeEnabled(15000)
    - page.getByLabel("Current namespace").selectOption("${namespace.StructuredContent.namespaceId}")
    - expect(page.getByLabel("Current namespace")).toHaveValue("${namespace.StructuredContent.namespaceId}",15000)
    - page.locator(".studio-nav-connectors").click()
    - page.getByRole("button", "New connector").click()
    - page.getByLabel("Name").fill("${caseName}")
    - page.getByLabel("Driver").click()
    - page.getByRole("menuitem", "SQLite").click()
    - page.getByLabel("DSN (blank keeps existing)").fill("${runDir}/consumer.db")
    - page.getByRole("button", "Save").click()
    - expect(page.locator(".bp6-dialog")).toHaveCount(0,15000)
    - page.getByLabel("Find connector, driver, or owner").fill("${caseName}")
    - page.getByRole("button", "Search").click()
    - expect(page.locator("xpath://div[@data-forge-container-id='connector-list']//tbody/tr")).toHaveCount(1,15000)
    - page.getByRole("button", "Test").click()
    - expect(page.getByRole("alert")).toHaveText("passed",15000)
    - expect(page.locator("xpath://div[@data-forge-container-id='connector-list']//tbody/tr[1]/td[5]")).toHaveText("passed",15000)
    - page.getByRole("button", "Activate or disable").click()
    - expect(page.locator("xpath://div[@data-forge-container-id='connector-list']//tbody/tr[1]/td[3]")).toHaveText("active",15000)
    - page.locator(".studio-nav-schema").click()
    - page.getByRole("button", "Connector").click()
    - page.getByRole("menuitem", "${caseName}").click()
    - page.getByLabel("Find tables or views").fill("${caseTable}")
    - page.getByRole("button", "Search tables").click()
    - page.getByRole("button", "Load schemas").click()
    - expect(page.getByRole("button", "Load schemas")).toBeEnabled(30000)
    - page.getByRole("button", "Search tables").click()
    - page.locator("xpath://tr[.//*[normalize-space(.)='${caseTable}']]//button[@aria-label='Inspect table']").click()
    - page.getByRole("button", "Add as root view").click()
    - page.getByLabel("Component title").fill("${caseTitle}")
    - page.getByLabel("Slug").fill("${caseSlug}")
    - page.getByLabel("Root view identifier").fill("record")
    - page.getByRole("button", "Create component").click()
    - expect(page.getByRole("button", "Edit component")).toBeVisible(15000)
  components:
    action: mcp/runner:call
    url: "$nativeMCP"
    bearerTokenSecret: "$ownerToken"
    "@name": studio.sdk.components.list
    arguments:
      namespaceId: "$namespace.StructuredContent.namespaceId"
      limit: 10
  oneComponent:
    action: validator:assert
    normalizeKVPairs: true
    actual: "$components.StructuredContent"
    expect:
      "@length@items": 1
      items:
      - title: "$caseTitle"
  authorInUI:
    action: webdriver:run
    sessionID: localhost:4445
    autoStart: false
    browser: chrome
    failureArtifacts:
      directory: "${runDir}/artifacts/${caseName}"
    commands:
    - page.getByRole("button", "Edit component").click()
    - page.getByLabel("Enable MCP tool").check()
    - page.getByLabel("Canonical MCP tool name").fill("${caseTool}")
    - page.getByRole("button", "Save component").click()
    - expect(page.locator(".bp6-dialog")).toHaveCount(0,15000)
    - page.getByRole("button", "Validate").click()
    - page.getByRole("button", "Validate revision").click()
    - expect(page.getByText("Runtime contract is ready")).toBeVisible(15000)
    - page.locator("xpath://div[contains(@class,'bp6-dialog-footer-actions')]//button[normalize-space(.)='Close']").click()
  componentSkillFolderInUI:
    action: webdriver:run
    sessionID: localhost:4445
    autoStart: false
    browser: chrome
    failureArtifacts:
      directory: "${runDir}/artifacts/${caseName}"
    commands:
    - page.locator(".studio-nav-skills").click()
    - page.getByRole("tab", "Component-owned").click()
    - page.getByRole("button", "Component").click()
    - page.getByRole("menuitem", "${caseTitle}").click()
    - page.getByRole("button", "New component skill").click()
    - page.getByRole("button", "Open folders").click()
    - page.getByLabel("Folder root").fill("component-guide")
    - page.getByLabel("URI prefix").fill("skill://${namespace.StructuredContent.namespaceId}/components/${components.StructuredContent.items[0].id}/1/component-guide")
    - page.getByRole("button", "Save folder").click()
    - expect(page.getByRole("button", "Update folder")).toBeVisible(15000)
    - page.getByRole("tab", "Skills (0)").click()
    - page.getByLabel("Skill root").fill(".")
    - 'page.getByLabel("Skill markup").fill("---\nname: component-guide\ndescription:
      Guide to the catalog component.\n---\nUse ${caseTool} to read the
      catalog records.\n")'
    - page.getByRole("button", "Create skill").click()
    - expect(page.getByRole("tab", "Skills (1)")).toBeVisible(15000)
    - page.locator("xpath://div[contains(@class,'bp6-dialog-footer-actions')]//button[normalize-space(.)='Close']").click()
    - expect(page.locator(".bp6-dialog")).toHaveCount(0,15000)
    - page.getByRole("button", "Validate").click()
    - page.getByRole("button", "Validate revision").click()
    - expect(page.getByText("Runtime contract is ready")).toBeVisible(15000)
    - page.locator("xpath://div[contains(@class,'bp6-dialog-footer-actions')]//button[normalize-space(.)='Close']").click()
  policyInUI:
    action: webdriver:run
    sessionID: localhost:4445
    autoStart: false
    browser: chrome
    failureArtifacts:
      directory: "${runDir}/artifacts/${caseName}"
    commands: "$policyCommands"
  closeEditor:
    action: webdriver:run
    sessionID: localhost:4445
    autoStart: false
    browser: chrome
    commands:
    - page.locator(".studio-nav-namespaces").click()
    - expect(page.getByLabel("Current namespace")).toBeEnabled(15000)
  versions:
    action: mcp/runner:call
    url: "$nativeMCP"
    bearerTokenSecret: "$ownerToken"
    "@name": studio.sdk.versions.list
    arguments:
      namespaceId: "$namespace.StructuredContent.namespaceId"
      reportId: "$components.StructuredContent.items[0].id"
  validated:
    action: validator:assert
    normalizeKVPairs: true
    actual: "$versions.StructuredContent.items[0].compileStatus"
    expect: valid
  runtime:
    action: mcp/runner:call
    url: "$nativeMCP"
    bearerTokenSecret: "$ownerToken"
    "@name": studio.sdk.runtime.status
    arguments:
      namespaceId: "$namespace.StructuredContent.namespaceId"
    allowToolError: true
    repeat: 50
    thinkTimeMs: 100
    exit: $output:/"status":"ready"/
  runtimeReady:
    action: validator:assert
    normalizeKVPairs: true
    actual: "$runtime.StructuredContent.host.status"
    expect: ready
  publishInUI:
    action: webdriver:run
    sessionID: localhost:4445
    autoStart: false
    browser: chrome
    failureArtifacts:
      directory: "${runDir}/artifacts/${caseName}"
    commands:
    - page.goto("${browserURL}")
    - page.locator(".studio-nav-components").click()
    - page.locator("input[placeholder='Find title, slug, or description']").fill("${caseTitle}")
    - page.getByRole("button", "Search components").click()
    - expect(page.locator("xpath://div[@data-forge-container-id='catalog-rows']//tbody/tr")).toHaveCount(1,15000)
    - page.getByRole("button", "Open Reader Builder").click()
    - expect(page.getByRole("heading", "Component graph")).toBeVisible(15000)
    - page.getByRole("button", "Release").click()
    - expect(page.getByRole("button", "Publish selected version")).toBeEnabled(15000)
    - page.getByRole("button", "Publish selected version").click()
    - expect(page.locator(".studio-publication-dialog .bp6-intent-success[role='status']")).toBeVisible(30000)
    - page.locator("xpath://div[contains(@class,'bp6-dialog-footer-actions')]//button[normalize-space(.)='Close']").click()
  publish:
    action: mcp/runner:call
    url: "$nativeMCP"
    bearerTokenSecret: "$ownerToken"
    "@name": studio.sdk.publications.get
    arguments:
      namespaceId: "$namespace.StructuredContent.namespaceId"
      reportId: "$components.StructuredContent.items[0].id"
  published:
    action: validator:assert
    normalizeKVPairs: true
    actual: "$publish.StructuredContent.status"
    expect: active
  endpoint:
    action: mcp/runner:call
    url: "$nativeMCP"
    bearerTokenSecret: "$ownerToken"
    "@name": studio.sdk.runtime.status
    arguments:
      namespaceId: "$namespace.StructuredContent.namespaceId"
  allowedCatalog:
    action: mcp/runner:listTools
    url: "$endpoint.StructuredContent.host.mcpUrl"
    bearerTokenSecret: "${runDir}/${allowedUser}.token"
  allowedTool:
    action: validator:assert
    normalizeKVPairs: true
    actual: "$allowedCatalog"
    expect:
      "@length@Tools": 3
      Tools:
      - Name: "${caseTool}"
      - Name: skills/get
      - Name: skills/list
  invokeAllowed:
    action: mcp/runner:call
    url: "$endpoint.StructuredContent.host.mcpUrl"
    bearerTokenSecret: "${runDir}/${allowedUser}.token"
    "@name": "${caseTool}"
    arguments: {}
  returnedData:
    action: validator:assert
    normalizeKVPairs: true
    actual: "$invokeAllowed"
    expect:
      IsError: false
      StructuredContent:
        "@length@records": 2
        records:
        - id: 10
          name: "${caseDataName} first"
        - id: 20
          name: "${caseDataName} second"
  deniedCatalog:
    action: mcp/runner:listTools
    url: "$endpoint.StructuredContent.host.mcpUrl"
    bearerTokenSecret: "${runDir}/${deniedUser}.token"
  hiddenTool:
    action: validator:assert
    normalizeKVPairs: true
    actual: "$deniedCatalog"
    expect:
      "@length@Tools": 2
      Tools:
      - Name: skills/get
      - Name: skills/list
  invokeDenied:
    action: mcp/runner:call
    url: "$endpoint.StructuredContent.host.mcpUrl"
    bearerTokenSecret: "${runDir}/${deniedUser}.token"
    "@name": "${caseTool}"
    arguments: {}
    allowProtocolError: true
    allowToolError: true
  directDenied:
    action: validator:assert
    normalizeKVPairs: true
    actual: "$invokeDenied"
    expect:
      IsError: true
      ProtocolErrorCode: -32600
  allowedSkills:
    action: mcp/runner:listSkills
    url: "$endpoint.StructuredContent.host.mcpUrl"
    bearerTokenSecret: "${runDir}/${allowedUser}.token"
  twoPublishedSkills:
    action: validator:assert
    normalizeKVPairs: true
    actual: "$allowedSkills"
    expect:
      "@length@Skills": 2
  getNamespaceSkill:
    action: mcp/runner:getSkill
    url: "$endpoint.StructuredContent.host.mcpUrl"
    bearerTokenSecret: "${runDir}/${allowedUser}.token"
    uri: skill://${namespace.StructuredContent.namespaceId}/${namespaceSkills.StructuredContent.items[0].skillId}/1/namespace-guide/SKILL.md
  NamespaceSkillManifest:
    action: validator:assert
    normalizeKVPairs: true
    actual: "$getNamespaceSkill"
    expect:
      IsError: false
      Skill:
        Uri: skill://${namespace.StructuredContent.namespaceId}/${namespaceSkills.StructuredContent.items[0].skillId}/1/namespace-guide/SKILL.md
        Frontmatter:
          name: namespace-guide
        Resources:
          "@length@Files": 2
  readNamespaceSkill:
    action: mcp/runner:readResource
    url: "$endpoint.StructuredContent.host.mcpUrl"
    bearerTokenSecret: "${runDir}/${allowedUser}.token"
    uri: skill://${namespace.StructuredContent.namespaceId}/${namespaceSkills.StructuredContent.items[0].skillId}/1/namespace-guide/SKILL.md
  NamespaceSkillBytes:
    action: validator:assert
    normalizeKVPairs: true
    actual: "$readNamespaceSkill.Contents[0].Text"
    expect: |
      ---
      name: namespace-guide
      description: Guide to this namespace.
      ---
      Use the customer tools in this namespace.
  getComponentSkill:
    action: mcp/runner:getSkill
    url: "$endpoint.StructuredContent.host.mcpUrl"
    bearerTokenSecret: "${runDir}/${allowedUser}.token"
    uri: skill://${namespace.StructuredContent.namespaceId}/components/${components.StructuredContent.items[0].id}/1/component-guide/SKILL.md
  ComponentSkillManifest:
    action: validator:assert
    normalizeKVPairs: true
    actual: "$getComponentSkill"
    expect:
      IsError: false
      Skill:
        Uri: skill://${namespace.StructuredContent.namespaceId}/components/${components.StructuredContent.items[0].id}/1/component-guide/SKILL.md
        Frontmatter:
          name: component-guide
        Resources:
          "@length@Files": 1
  readComponentSkill:
    action: mcp/runner:readResource
    url: "$endpoint.StructuredContent.host.mcpUrl"
    bearerTokenSecret: "${runDir}/${allowedUser}.token"
    uri: skill://${namespace.StructuredContent.namespaceId}/components/${components.StructuredContent.items[0].id}/1/component-guide/SKILL.md
  ComponentSkillBytes:
    action: validator:assert
    normalizeKVPairs: true
    actual: "$readComponentSkill.Contents[0].Text"
    expect: |
      ---
      name: component-guide
      description: Guide to the catalog component.
      ---
      Use ${caseTool} to read the catalog records.
  deniedSkills:
    action: mcp/runner:listSkills
    url: "$endpoint.StructuredContent.host.mcpUrl"
    bearerTokenSecret: "${runDir}/${deniedUser}.token"
  componentSkillHidden:
    action: validator:assert
    normalizeKVPairs: true
    actual: "$deniedSkills"
    expect:
      "@length@Skills": 1
      Skills:
      - Frontmatter:
          name: namespace-guide
  deniedComponentSkill:
    action: mcp/runner:getSkill
    url: "$endpoint.StructuredContent.host.mcpUrl"
    bearerTokenSecret: "${runDir}/${deniedUser}.token"
    uri: skill://${namespace.StructuredContent.namespaceId}/components/${components.StructuredContent.items[0].id}/1/component-guide/SKILL.md
    allowProtocolError: true
  hiddenSkillCannotBeFetched:
    action: validator:assert
    normalizeKVPairs: true
    actual: "$deniedComponentSkill.IsError"
    expect: true
