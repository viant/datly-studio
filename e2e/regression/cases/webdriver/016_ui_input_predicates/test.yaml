    bearerTokenSecret: $ownerToken
    "@name": studio.sdk.preview.execute
    arguments:
      namespaceId: $namespace.StructuredContent.namespaceId
      reportId: $components.StructuredContent.items[0].id
      versionNo: 1
      input:
        input: {}
        limit: 50
    allowToolError: true
  baselineSucceeded:
    action: validator:assert
    normalizeKVPairs: true
    actual: $baseline
    expect:
      IsError: false
  baselineRows:
    action: validator:assert
    normalizeKVPairs: true
    actual: $baseline.StructuredContent.evidence
    expect:
      returnedRows: 4
  baselineIDs:
    action: validator:assert
    normalizeKVPairs: true
    actual: $baseline.StructuredContent.data.records
    expect:
      - id: 1
      - id: 2
      - id: 3
      - id: 4
