init:
  caseName: ui_input_predicates
pipeline:
  createNamespace:
    action: webdriver:run
    browser: chrome
    sessionID: localhost:4445
    autoStart: false
    failureArtifacts:
      directory: ${runDir}/artifacts/webdriver
    commands:
      - page.goto("${browserURL}")
      - page.getByRole("button", "Namespaces").click()
      - page.getByRole("button", "New namespace").click()
      - page.getByLabel("Namespace").fill("${caseName}")
      - page.getByLabel("Display title").fill("${caseName}")
      - page.getByRole("button", "Save").click()
      - expect(page.locator(".bp6-dialog")).toHaveCount(0,15000)
  namespace:
    action: mcp/runner:call
    url: $nativeMCP
    bearerTokenSecret: $ownerToken
    "@name": studio.sdk.namespaces.get
    arguments:
      name: $caseName
    allowToolError: true
  namespaceSucceeded:
    action: validator:assert
    normalizeKVPairs: true
    actual: $namespace
    expect:
      IsError: false
  createConnector:
    action: webdriver:run
    browser: chrome
    sessionID: localhost:4445
    autoStart: false
    failureArtifacts:
      directory: ${runDir}/artifacts/webdriver
    commands:
      - page.goto("${browserURL}")
      - page.getByLabel("Current namespace").selectOption("${namespace.StructuredContent.namespaceId}")
      - page.getByRole("button", "Connectors").click()
      - page.getByRole("button", "New connector").click()
      - page.getByLabel("Name").fill("${caseName}")
      - page.getByLabel("Driver").click()
      - page.getByRole("menuitem", "SQLite").click()
      - page.getByLabel("DSN (blank keeps existing)").fill("${runDir}/consumer.db")
      - page.getByRole("button", "Save").click()
      - expect(page.locator(".bp6-dialog")).toHaveCount(0,15000)
      - page.getByLabel("Find connector, driver, or owner").fill("${caseName}")
      - page.getByRole("button", "Search").click()
      - expect(page.locator("xpath://div[@data-forge-container-id='connector-list']//tbody/tr")).toHaveCount(1,15000)
      - page.getByRole("button", "Test").click()
      - expect(page.getByRole("alert")).toHaveText("passed",15000)
      - expect(page.locator("xpath://div[@data-forge-container-id='connector-list']//tbody/tr[1]/td[5]")).toHaveText("passed",15000)
      - page.getByRole("button", "Refresh").click()
      - page.getByRole("button", "Activate or disable").click()
      - expect(page.locator("xpath://div[@data-forge-container-id='connector-list']//tbody/tr[1]/td[3]")).toHaveText("active",15000)
  createReader:
    action: webdriver:run
    browser: chrome
    sessionID: localhost:4445
    autoStart: false
    failureArtifacts:
      directory: ${runDir}/artifacts/webdriver
    commands:
      - page.locator(".studio-nav-components").click()
      - page.getByRole("button", "New component").click()
      - page.getByLabel("Component title").fill("UI predicate lifecycle")
      - page.getByRole("button", "Active connector").click()
      - page.locator("input[placeholder='Find connector']").fill("${caseName}")
      - page.getByRole("menuitem", "${caseName} · sqlite").click()
      - page.getByRole("button", "Create component").click()
      - expect(page.getByRole("heading", "Root SQL")).toBeVisible(15000)
      - page.getByLabel("Component visibility").selectOption("internal")
      - page.locator(".studio-code-editor [contenteditable='true']").fill("SELECT c.id, c.tenant, c.name, c.active FROM customers c ORDER BY c.id")
      - page.getByRole("button", "Create reader").click()
      - expect(page.getByRole("heading", "Component graph")).toBeVisible(15000)
      - page.getByRole("tab", "Inputs").click()
  createInputs:
    action: webdriver:run
    browser: chrome
    sessionID: localhost:4445
    autoStart: false
    failureArtifacts:
      directory: ${runDir}/artifacts/webdriver
    commands:
      - page.getByRole("button", "Add input").click()
      - page.getByLabel("Input name").fill("Limit")
      - page.getByLabel("Type expression").fill("int")
      - page.getByLabel("Kind source").fill("limit")
      - page.getByLabel("Query selector view").click()
      - page.getByRole("menuitem", "reader (record)").click()
      - page.getByRole("button", "Save input").click()
      - expect(page.locator(".studio-forge-contract-window")).toHaveCount(0,15000)
      - page.getByRole("button", "Add input").click()
      - page.getByLabel("Input name").fill("IDs")
      - page.getByLabel("Type expression").fill("[]int")
      - page.getByLabel("Kind source").fill("ids")
      - page.locator("xpath://summary[normalize-space(.)='Predicate']").click()
      - page.getByLabel("Predicate").click()
      - page.getByRole("menuitem", "in").click()
      - page.getByLabel("SQL alias").fill("c")
      - page.getByLabel("Filter dimension").click()
      - page.getByRole("menuitem", "id").click()
      - page.getByRole("button", "Save input").click()
      - expect(page.locator(".studio-forge-contract-window")).toHaveCount(0,15000)
      - page.getByRole("button", "Add input").click()
      - page.getByLabel("Input name").fill("Active")
      - page.getByLabel("Type expression").fill("int")
      - page.getByLabel("Kind source").fill("active")
      - page.locator("xpath://summary[normalize-space(.)='Predicate']").click()
      - page.getByLabel("Predicate").click()
      - page.getByRole("menuitem", "expr").click()
      - page.getByLabel("Predicate arguments").fill("COALESCE(c.active, 0) = ?")
      - page.getByRole("button", "Save input").click()
      - expect(page.locator(".studio-forge-contract-window")).toHaveCount(0,15000)
      - page.getByRole("button", "Add input").click()
      - page.getByLabel("Input name").fill("Tenant")
      - page.getByLabel("Type expression").fill("string")
      - page.getByLabel("Kind source").fill("tenant")
      - page.locator("xpath://summary[normalize-space(.)='Predicate']").click()
      - page.getByLabel("Predicate").click()
      - page.getByRole("menuitem", "Custom Go predicate").click()
      - page.getByLabel("Custom predicate").click()
      - page.getByLabel("Find custom predicate").fill("CustomerScope")
      - page.getByRole("menuitem", "CustomerScope — github.com/viant/datly-studio/e2e/predicates").click()
      - page.getByRole("button", "Save input").click()
      - expect(page.locator(".studio-forge-contract-window")).toHaveCount(0,15000)
  components:
