init:
  caseName: ui_schema_layout
pipeline:
  createNamespaceInUI:
    action: webdriver:run
    sessionID: localhost:4445
    autoStart: false
    browser: chrome
    failureArtifacts:
      directory: ${runDir}/artifacts/${caseName}
    commands:
      - page.goto("${browserURL}")
      - page.locator(".studio-nav-namespaces").click()
      - page.getByRole("button", "New namespace").click()
      - page.getByLabel("Namespace").fill("${caseName}")
      - expect(page.getByLabel("Namespace")).toHaveValue("${caseName}",15000)
      - page.getByLabel("Display title").fill("${caseName}")
      - expect(page.getByLabel("Namespace")).toHaveValue("${caseName}",15000)
      - page.getByRole("button", "Visibility").click()
      - page.getByRole("menuitem", "Public").click()
      - page.getByLabel("Expose MCP").check()
      - page.getByRole("button", "Save").click()
      - expect(page.locator(".bp6-dialog")).toHaveCount(0,15000)
  namespace:
    action: mcp/runner:call
    url: $nativeMCP
    bearerTokenSecret: $ownerToken
    "@name": studio.sdk.namespaces.get
    arguments:
      name: $caseName
  createConnectorInUI:
    action: webdriver:run
    sessionID: localhost:4445
    autoStart: false
    browser: chrome
    failureArtifacts:
      directory: ${runDir}/artifacts/${caseName}
    commands:
      - expect(page.getByLabel("Current namespace")).toBeEnabled(15000)
      - page.getByLabel("Current namespace").selectOption("${namespace.StructuredContent.namespaceId}")
      - expect(page.getByLabel("Current namespace")).toHaveValue("${namespace.StructuredContent.namespaceId}",15000)
      - page.locator(".studio-nav-connectors").click()
      - page.getByRole("button", "New connector").click()
      - page.getByLabel("Name").fill("${caseName}")
      - page.getByLabel("Driver").click()
      - page.getByRole("menuitem", "SQLite").click()
      - page.getByLabel("DSN (blank keeps existing)").fill("${runDir}/consumer.db")
      - page.getByRole("button", "Save").click()
      - expect(page.locator(".bp6-dialog")).toHaveCount(0,15000)
      - page.getByLabel("Find connector, driver, or owner").fill("${caseName}")
      - page.getByRole("button", "Search").click()
      - expect(page.locator("xpath://div[@data-forge-container-id='connector-list']//tbody/tr")).toHaveCount(1,15000)
      - page.getByRole("button", "Test").click()
      - expect(page.getByRole("alert")).toHaveText("passed",15000)
      - expect(page.locator("xpath://div[@data-forge-container-id='connector-list']//tbody/tr[1]/td[5]")).toHaveText("passed",15000)
      - page.getByRole("button", "Activate or disable").click()
      - expect(page.locator("xpath://div[@data-forge-container-id='connector-list']//tbody/tr[1]/td[3]")).toHaveText("active",15000)
  browseInUI:
    action: webdriver:run
    sessionID: localhost:4445
    autoStart: false
    browser: chrome
    failureArtifacts: &a1
      directory: ${runDir}/artifacts/${caseName}
    commands:
      - page.locator(".studio-nav-schema").click()
      - page.getByRole("button", "Connector").click()
      - page.getByRole("menuitem", "${caseName}").click()
      - page.getByRole("button", "Load schemas").click()
      - expect(page.getByRole("button", "Load schemas")).toBeEnabled(30000)
      - page.getByRole("button", "Search tables").click()
      - expect(page.locator("xpath://tr[.//*[normalize-space(.)='customers']]//button[@aria-label='Inspect table']")).toBeVisible(15000)
  layout:
    action: webdriver:call-driver
    sessionID: localhost:4445
    call:
      method: ExecuteScript
      parameters:
        - const byId=id=>document.querySelector('[data-forge-container-id="'+id+'"]');const box=id=>byId(id).getBoundingClientRect();const frame=box('schema-layout'),left=box('schema-explorer'),right=box('schema-detail'),list=box('schema-object-list'),controls=box('schema-selectors');const query=byId('schema-selectors').querySelector('input'),find=byId('schema-selectors').querySelector('button[aria-label="Search tables"]'),header=byId('schema-object-list').querySelector('thead th'),first=byId('schema-object-list').querySelector('tbody tr');const bg=getComputedStyle(header).backgroundColor.replace(/\s/g,'');return{explorerWidthBounded:left.width>=260&&left.width<=340,detailBesideExplorer:right.left>=left.right-1,viewportBounded:frame.bottom<=innerHeight+1,listHasUsableHeight:list.height>=120,bindingsReserveNoSpace:box('schema-bindings').height===0,searchBelowQuery:find.getBoundingClientRect().top>=query.getBoundingClientRect().bottom-1,queryFillsExplorer:query.getBoundingClientRect().width>=controls.width*.9,headerOpaque:bg!=='transparent'&&bg!=='rgba(0,0,0,0)',firstRowBelowHeader:first.getBoundingClientRect().top>=header.getBoundingClientRect().bottom-1,noPageHorizontalOverflow:document.documentElement.scrollWidth<=innerWidth+1};
        - - 0
  layoutPreserved:
    action: validator:assert
    actual: $layout.Data.ExecuteScript
    expect:
      explorerWidthBounded: true
      detailBesideExplorer: true
      viewportBounded: true
      listHasUsableHeight: true
      bindingsReserveNoSpace: true
      searchBelowQuery: true
      queryFillsExplorer: true
      headerOpaque: true
      firstRowBelowHeader: true
      noPageHorizontalOverflow: true
  queryInUI:
    action: webdriver:run
    sessionID: localhost:4445
    autoStart: false
    browser: chrome
    failureArtifacts: *a1
    commands:
      - page.locator("xpath://tr[.//*[normalize-space(.)='customers']]//button[@aria-label='Inspect table']").click()
      - expect(page.getByRole("heading", "customers")).toBeVisible(15000)
      - page.getByRole("button", "Test SQL").click()
      - expect(page.getByRole("heading", "SQL test result")).toBeVisible(15000)
      - expect(page.locator("xpath://section[contains(@class,'forge-nested-collection')]//td[normalize-space(.)='Ada']")).toBeVisible(15000)
