  status:
    action: mcp/runner:call
    url: $nativeMCP
    bearerTokenSecret: $ownerToken
    '@name': studio.sdk.runtime.status
    arguments:
      namespaceId: $alphanamespace.StructuredContent.namespaceId
  allReadersReady:
    action: validator:assert
    actual: $status.StructuredContent
    expect:
      host:
        status: ready
      '@length@readers': 100
  tools:
    action: mcp/runner:listTools
    url: $status.StructuredContent.host.mcpUrl
    bearerTokenSecret: $ownerToken
  allToolsPresent:
    action: validator:assert
    actual: $tools
    expect:
