pipeline:
  createConnector:
    action: mcp/runner:call
    url: $nativeMCP
    bearerTokenSecret: $ownerToken
    arguments:
      name: codecs
      driver: sqlite
      dsnTemplate: ${runDir}/consumer.db
    allowToolError: true
    '@name': studio.sdk.connectors.create
  createConnectorSucceeded:
    action: validator:assert
    normalizeKVPairs: true
    actual: $createConnector
    expect:
      IsError: false
  probe:
    action: mcp/runner:call
    url: $nativeMCP
    bearerTokenSecret: $ownerToken
    arguments:
      name: codecs
    allowToolError: true
    '@name': studio.sdk.connectors.test
  probeSucceeded:
    action: validator:assert
    normalizeKVPairs: true
    actual: $probe
    expect:
      IsError: false
  connector:
    action: mcp/runner:call
    url: $nativeMCP
    bearerTokenSecret: $ownerToken
    arguments:
      name: codecs
    allowToolError: true
    '@name': studio.sdk.connectors.get
  connectorSucceeded:
    action: validator:assert
    normalizeKVPairs: true
    actual: $connector
    expect:
      IsError: false
  activate:
    action: mcp/runner:call
    url: $nativeMCP
    bearerTokenSecret: $ownerToken
    arguments:
      name: codecs
      etag: $connector.StructuredContent.etag
    allowToolError: true
    '@name': studio.sdk.connectors.activate
  activateSucceeded:
    action: validator:assert
    normalizeKVPairs: true
    actual: $activate
    expect:
      IsError: false
  namespace:
    action: mcp/runner:call
    url: $nativeMCP
    bearerTokenSecret: $ownerToken
    arguments:
      name: codecs
      title: codecs
      mcpEnabled: true
      mcpPort: 0
    allowToolError: true
    '@name': studio.sdk.namespaces.create
  namespaceSucceeded:
    action: validator:assert
    normalizeKVPairs: true
    actual: $namespace
    expect:
      IsError: false
  component:
    action: mcp/runner:call
    url: $nativeMCP
    bearerTokenSecret: $ownerToken
    arguments:
      namespaceId: $namespace.StructuredContent.namespaceId
      title: codecs
      slug: codecs
      namespace: codecs
      defaultConnectorName: codecs
    allowToolError: true
    '@name': studio.sdk.components.create
  componentSucceeded:
    action: validator:assert
    normalizeKVPairs: true
    actual: $component
    expect:
      IsError: false
  import:
    action: mcp/runner:call
    url: $nativeMCP
    bearerTokenSecret: $ownerToken
    arguments:
      namespaceId: $namespace.StructuredContent.namespaceId
      reportId: $component.StructuredContent.id
      input:
        dql: |-
          #package('github.com/viant/datly-studio/dynamic/codecs')
          #setting($_ = $input_type('CustomerInput'))
          #setting($_ = $output_type('CustomerOutput'))
          #setting($_ = $case_format('lc'))
          #setting($_ = $connector('codecs'))
          #setting($_ = $route('/codecs', 'GET'))
          #setting($_ = $mcp('codecs.read','Read consumer customers'))
          #import('consumer','github.com/viant/datly-studio/e2e/predicates')
          #define($_ = $Tenant<string>(query/tenant).Required().WithCodec('github.com/viant/datly-studio/e2e/codecs.Tenant').WithPredicate(0,'handler','consumer.CustomerScope'))
          #define($_ = $Rows<[]*Customer>(output/view))
          SELECT customers.*, type(customers,'Customer') FROM (SELECT c.id,c.tenant,c.name,c.active FROM customers c WHERE 1=1 ${predicate.Builder().CombineAnd($predicate.FilterGroup(0, "AND")).Build("AND")}) customers
    allowToolError: true
    '@name': studio.sdk.versions.load_dql
  importSucceeded:
    action: validator:assert
    normalizeKVPairs: true
    actual: $import
    expect:
      IsError: false
  verifyImport:
    action: validator:assert
    actual: $import.StructuredContent.version
    expect:
      state: draft
      compileStatus: pending
    normalizeKVPairs: true
  validate:
    action: mcp/runner:call
    url: $nativeMCP
    bearerTokenSecret: $ownerToken
    arguments:
      namespaceId: $namespace.StructuredContent.namespaceId
      reportId: $component.StructuredContent.id
      versionNo: $import.StructuredContent.version.versionNo
      expectedSourceRevision: $import.StructuredContent.version.sourceRevision
    allowToolError: true
    '@name': studio.sdk.versions.validate
  validateSucceeded:
    action: validator:assert
    normalizeKVPairs: true
    actual: $validate
    expect:
      IsError: false
      StructuredContent:
        valid: true
  preview:
    action: mcp/runner:call
    url: $nativeMCP
    bearerTokenSecret: $ownerToken
    '@name': studio.sdk.preview.execute
    arguments:
      namespaceId: $namespace.StructuredContent.namespaceId
      reportId: $component.StructuredContent.id
      versionNo: $import.StructuredContent.version.versionNo
      input:
        input:
          Tenant: ' ALPHA '
        limit: 20
  previewRows:
    action: validator:assert
    normalizeKVPairs: true
    actual: $preview
    expect:
      IsError: false
      StructuredContent:
        evidence:
          returnedRows: 3
  previewValues:
    action: validator:assert
    normalizeKVPairs: true
    actual: $preview.StructuredContent.data
    expect:
      '@length@rows': 3
      rows:
        '@indexBy@': id
        1:
          tenant: alpha
          name: Ada
        2:
          tenant: alpha
          name: Lin
        4:
          tenant: alpha
          name: No orders
  invalidPreview:
    action: mcp/runner:call
    url: $nativeMCP
    bearerTokenSecret: $ownerToken
    '@name': studio.sdk.preview.execute
    arguments:
      namespaceId: $namespace.StructuredContent.namespaceId
      reportId: $component.StructuredContent.id
      versionNo: $import.StructuredContent.version.versionNo
      input:
        input:
          Tenant: 'alpha OR 1=1'
        limit: 20
    allowToolError: true
    allowProtocolError: true
  invalidPreviewRejected:
    action: validator:assert
    normalizeKVPairs: true
    actual: $invalidPreview.IsError
    expect: true
  predicateTypes:
    action: mcp/runner:call
    url: $nativeMCP
    bearerTokenSecret: $ownerToken
    '@name': studio.sdk.authorization_predicates.types
    arguments: {}
  predicateTypesSucceeded:
    action: validator:assert
    normalizeKVPairs: true
    actual: $predicateTypes.IsError
    expect: false
  codecAbsentFromPredicateTypes:
    action: validator:assert
    normalizeKVPairs: true
    actual: $predicateTypes.StructuredContent.items
    expect:
      '@indexBy@': typeName
      '@exists@Tenant': false
      CustomerScope:
        packagePath: github.com/viant/datly-studio/e2e/predicates
        typeName: CustomerScope
  publishHostReady:
    action: mcp/runner:call
    url: $nativeMCP
    bearerTokenSecret: $ownerToken
    '@name': studio.sdk.runtime.status
    arguments:
      namespaceId: $namespace.StructuredContent.namespaceId
    allowToolError: true
    repeat: 50
    thinkTimeMs: 100
    exit: $output:/"status":"ready"/
  publishHostReadyAssert:
    action: validator:assert
    normalizeKVPairs: true
    actual: $publishHostReady.StructuredContent.host.status
    expect: ready
  publish:
    action: mcp/runner:call
    url: $nativeMCP
    bearerTokenSecret: $ownerToken
    arguments:
      namespaceId: $namespace.StructuredContent.namespaceId
      reportId: $component.StructuredContent.id
      versionNo: $import.StructuredContent.version.versionNo
      input:
        expectedSourceRevision: $import.StructuredContent.version.sourceRevision
        reason: Endly acceptance
    allowToolError: true
    '@name': studio.sdk.publications.publish
  publishSucceeded:
    action: validator:assert
    normalizeKVPairs: true
    actual: $publish
    expect:
      IsError: false
  active:
    action: validator:assert
    actual: $publish.StructuredContent.status
    expect: active
    normalizeKVPairs: true
  status:
    action: mcp/runner:call
    url: $nativeMCP
    bearerTokenSecret: $ownerToken
    arguments:
      namespaceId: $namespace.StructuredContent.namespaceId
    allowToolError: true
    '@name': studio.sdk.runtime.status
  statusSucceeded:
    action: validator:assert
    normalizeKVPairs: true
    actual: $status
    expect:
      IsError: false
  runtime:
    action: validator:assert
    actual: $status.StructuredContent.host
    expect:
      namespaceId: $namespace.StructuredContent.namespaceId
      status: ready
    normalizeKVPairs: true
  invoke:
    action: mcp/runner:call
    url: $status.StructuredContent.host.mcpUrl
    arguments:
      Tenant: ' BETA '
    bearerTokenSecret: $ownerToken
    '@name': $status.StructuredContent.readers[0].mcpExposures[0].name
    allowToolError: true
  invokeSucceeded:
    action: validator:assert
    normalizeKVPairs: true
    actual: $invoke
    expect:
      IsError: false
  data:
    action: validator:assert
    actual: $invoke
    normalizeKVPairs: true
    expect:
      IsError: false
      StructuredContent:
        '@length@rows': 1
        rows:
          - id: 3
            tenant: beta
            name: Sam
  invalid:
    action: mcp/runner:call
    url: $status.StructuredContent.host.mcpUrl
    bearerTokenSecret: $ownerToken
    '@name': codecs.read
    arguments:
      Tenant: 'alpha OR 1=1'
    allowToolError: true
    allowProtocolError: true
  invalidRejected:
    action: validator:assert
    actual: $invalid.IsError
    expect: true
    normalizeKVPairs: true
  codecAsPredicate:
    action: mcp/runner:call
    url: $nativeMCP
    bearerTokenSecret: $ownerToken
    '@name': studio.sdk.authorization_predicates.create
    arguments:
      name: codec.not.predicate
      title: Codec is not an authorization predicate
      packagePath: github.com/viant/datly-studio/e2e/codecs
      typeName: Tenant
    allowToolError: true
  codecNotPredicate:
    action: validator:assert
    actual: $codecAsPredicate.IsError
    normalizeKVPairs: true
    expect: true
  events:
    action: mcp/runner:call
    url: $nativeMCP
    bearerTokenSecret: $ownerToken
    arguments:
      namespaceId: $namespace.StructuredContent.namespaceId
      reportId: $component.StructuredContent.id
      input: {}
    allowToolError: true
    '@name': studio.sdk.publications.events.list
  eventsSucceeded:
    action: validator:assert
    normalizeKVPairs: true
    actual: $events
    expect:
      IsError: false
