pipeline:
  alphacreateConnector:
    action: mcp/runner:call
    url: $nativeMCP
    bearerTokenSecret: $ownerToken
    arguments:
      name: isolatedalpha
      driver: sqlite
      dsnTemplate: ${runDir}/consumer.db
    allowToolError: false
    '@name': studio.sdk.connectors.create
  alphacreateConnectorSucceeded:
    action: validator:assert
    normalizeKVPairs: true
    actual: $alphacreateConnector.IsError
    expect: false
  alphaprobe:
    action: mcp/runner:call
    url: $nativeMCP
    bearerTokenSecret: $ownerToken
    arguments:
      name: isolatedalpha
    allowToolError: false
    '@name': studio.sdk.connectors.test
  alphaprobeSucceeded:
    action: validator:assert
    normalizeKVPairs: true
    actual: $alphaprobe.IsError
    expect: false
  alphaconnector:
    action: mcp/runner:call
    url: $nativeMCP
    bearerTokenSecret: $ownerToken
    arguments:
      name: isolatedalpha
    allowToolError: false
    '@name': studio.sdk.connectors.get
  alphaconnectorSucceeded:
    action: validator:assert
    normalizeKVPairs: true
    actual: $alphaconnector.IsError
    expect: false
  alphaactivate:
    action: mcp/runner:call
    url: $nativeMCP
    bearerTokenSecret: $ownerToken
    arguments:
      name: isolatedalpha
      etag: $alphaconnector.StructuredContent.etag
    allowToolError: false
    '@name': studio.sdk.connectors.activate
  alphaactivateSucceeded:
    action: validator:assert
    normalizeKVPairs: true
    actual: $alphaactivate.IsError
    expect: false
  alphanamespace:
    action: mcp/runner:call
    url: $nativeMCP
    bearerTokenSecret: $ownerToken
    arguments:
      name: isolatedalpha
      title: isolatedalpha
      mcpEnabled: true
      mcpPort: 0
    allowToolError: false
    '@name': studio.sdk.namespaces.create
  alphanamespaceSucceeded:
    action: validator:assert
    normalizeKVPairs: true
    actual: $alphanamespace.IsError
    expect: false
  alphacomponent:
    action: mcp/runner:call
    url: $nativeMCP
    bearerTokenSecret: $ownerToken
    arguments:
      namespaceId: $alphanamespace.StructuredContent.namespaceId
      title: isolatedalpha
      slug: isolatedalpha
      namespace: isolatedalpha
      defaultConnectorName: isolatedalpha
    allowToolError: false
    '@name': studio.sdk.components.create
  alphacomponentSucceeded:
    action: validator:assert
    normalizeKVPairs: true
    actual: $alphacomponent.IsError
    expect: false
  alphaimport:
    action: mcp/runner:call
    url: $nativeMCP
    bearerTokenSecret: $ownerToken
    arguments:
      namespaceId: $alphanamespace.StructuredContent.namespaceId
      reportId: $alphacomponent.StructuredContent.id
      input:
        dql: |-
          #package('github.com/viant/datly-studio/dynamic/isolatedalpha')
          #setting($_ = $input_type('CustomerInput'))
          #setting($_ = $output_type('CustomerOutput'))
          #setting($_ = $case_format('lc'))
          #setting($_ = $connector('isolatedalpha'))
          #setting($_ = $route('/isolatedalpha', 'GET'))
          #setting($_ = $mcp('isolatedalpha.read','Read consumer customers'))
          #define($_ = $Rows<[]*Customer>(output/view))
          SELECT customers.*, type(customers,'Customer') FROM (SELECT c.id,c.tenant,c.name,c.active FROM customers c) customers
    allowToolError: false
    '@name': studio.sdk.versions.load_dql
  alphaimportSucceeded:
    action: validator:assert
    normalizeKVPairs: true
    actual: $alphaimport.IsError
    expect: false
  alphaverifyImport:
    action: validator:assert
    normalizeKVPairs: true
    actual: $alphaimport.StructuredContent.version
    expect:
      state: draft
      compileStatus: pending
  alphavalidate:
    action: mcp/runner:call
    url: $nativeMCP
    bearerTokenSecret: $ownerToken
    arguments:
      namespaceId: $alphanamespace.StructuredContent.namespaceId
      reportId: $alphacomponent.StructuredContent.id
      versionNo: $alphaimport.StructuredContent.version.versionNo
      expectedSourceRevision: $alphaimport.StructuredContent.version.sourceRevision
    allowToolError: false
    '@name': studio.sdk.versions.validate
  alphavalidateSucceeded:
    action: validator:assert
    normalizeKVPairs: true
    actual: $alphavalidate.IsError
    expect: false
  alphapublishHostReady:
    action: mcp/runner:call
    url: $nativeMCP
    bearerTokenSecret: $ownerToken
    '@name': studio.sdk.runtime.status
    arguments:
      namespaceId: $alphanamespace.StructuredContent.namespaceId
    allowToolError: true
    repeat: 50
    thinkTimeMs: 100
    exit: $output:/"status":"ready"/
  alphapublishHostReadyAssert:
    action: validator:assert
    normalizeKVPairs: true
    actual: $alphapublishHostReady.StructuredContent.host.status
    expect: ready
  alphapublish:
    action: mcp/runner:call
    url: $nativeMCP
    bearerTokenSecret: $ownerToken
    arguments:
      namespaceId: $alphanamespace.StructuredContent.namespaceId
      reportId: $alphacomponent.StructuredContent.id
      versionNo: $alphaimport.StructuredContent.version.versionNo
      input:
        expectedSourceRevision: $alphaimport.StructuredContent.version.sourceRevision
    allowToolError: false
    '@name': studio.sdk.publications.publish
  alphapublishSucceeded:
    action: validator:assert
    normalizeKVPairs: true
    actual: $alphapublish.IsError
    expect: false
  alphastatus:
    action: mcp/runner:call
    url: $nativeMCP
    bearerTokenSecret: $ownerToken
    arguments:
      namespaceId: $alphanamespace.StructuredContent.namespaceId
    allowToolError: false
    '@name': studio.sdk.runtime.status
  alphastatusSucceeded:
    action: validator:assert
    normalizeKVPairs: true
    actual: $alphastatus.IsError
    expect: false
  betacreateConnector:
    action: mcp/runner:call
    url: $nativeMCP
    bearerTokenSecret: $ownerToken
