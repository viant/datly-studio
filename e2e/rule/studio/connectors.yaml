pipeline:
  unit:
    action: exec:run
    target: $target
    checkError: true
    TimeoutMs: 120000
    commands:
      - cd ${appPath}
      - GOWORK=off go test -count=1 -v ./dql/studio/connectors

  sources:
    action: exec:run
    target: $target
    checkError: true
    commands:
      - cd ${appPath}
      - test -f dql/studio/connectors/reader/connector.dql
      - test -f dql/studio/connectors/reader/sql/read.sql
      - test -f dql/studio/connectors/writer/connector.dql
      - test -f dql/studio/connectors/writer/sql/patch.sql
