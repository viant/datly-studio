pipeline:
  create:
    action: mcp/runner:call
    url: $nativeMCP
    bearerTokenSecret: $ownerToken
    '@name': studio.sdk.connectors.create
    arguments:
      name: discovery_scoped
      driver: sqlite
      dsnTemplate: ${runDir}/discovery-primary.db
      options:
        sqliteAttachments:
          lookup: ${runDir}/discovery-lookup.db
  probe:
    action: mcp/runner:call
    url: $nativeMCP
    bearerTokenSecret: $ownerToken
    '@name': studio.sdk.connectors.test
    arguments: {name: discovery_scoped}
  activate:
    action: mcp/runner:call
    url: $nativeMCP
    bearerTokenSecret: $ownerToken
    '@name': studio.sdk.connectors.activate
    arguments: {name: discovery_scoped, etag: 1}
  discover:
    action: mcp/runner:call
    url: $nativeMCP
    bearerTokenSecret: $ownerToken
    '@name': studio.sdk.connectors.discover
    arguments: {name: discovery_scoped, input: {}}
  metadata:
    action: validator:assert
    actual: $discover.StructuredContent
    expect:
      driver: sqlite
      product: SQLite
      '@length@schemas': 2
  browseAndEditLists:
    action: webdriver:run
    sessionID: localhost:4446
    autoStart: false
    browser: chrome
    failureArtifacts: {directory: '${runDir}/artifacts/discovery'}
    commands:
      - page.goto("${browserURL}/e2e/login")
      - page.getByLabel("Test identity").selectOption("owner")
      - page.getByRole("button", "Sign in").click()
      - page.locator("xpath://aside[contains(@class,'studio-sidebar')]//button[normalize-space(.)='Explorer']").click()
      - expect(page.getByRole("button", "Load schemas")).toBeEnabled(15000)
      - expect(page.getByRole("button", "Inspect table")).toHaveCount(0,15000)
      - page.getByRole("button", "Load schemas").click()
      - expect(page.getByRole("button", "Load schemas")).toBeEnabled(30000)
      - page.getByRole("button", "Edit lookup lists").click()
      - page.getByRole("button", "Add project / catalog").click()
      - page.getByLabel("Project / catalog 1").fill("local")
      - page.getByRole("button", "Remove schema / dataset 1").click()
      - page.getByLabel("Project / catalog (optional) 1").fill("local")
      - page.getByLabel("Schema / dataset 1").fill("lookup")
      - page.getByRole("button", "Save lookup lists").click()
      - expect(page.locator(".bp6-dialog")).toHaveCount(0,15000)
      - page.getByRole("button", "Project / catalog").click()
      - page.getByRole("menuitem", "local").click()
      - page.getByRole("button", "Schema / dataset").click()
      - page.getByRole("menuitem", "lookup").click()
      - page.getByRole("button", "Search tables").click()
      - expect(page.getByRole("button", "Inspect table")).toHaveCount(1,15000)
      - page.getByRole("button", "Inspect table").click()
      - page.getByRole("tab", "Columns").click()
      - expect(page.locator("xpath://td[normalize-space(.)='dataset_marker']")).toBeVisible(15000)
      - expect(page.locator("xpath://td[normalize-space(.)='main_marker']")).toHaveCount(0,15000)
  connectorStateInUI:
    action: webdriver:run
    sessionID: localhost:4446
    autoStart: false
    browser: chrome
    failureArtifacts: {directory: '${runDir}/artifacts/connector-state'}
    commands:
      - page.locator("xpath://aside[contains(@class,'studio-sidebar')]//button[normalize-space(.)='Connectors']").click()
      - page.getByLabel("Find connector, driver, or owner").fill("discovery_scoped")
      - page.getByRole("button", "Search").click()
      - expect(page.getByRole("button", "Activate or disable")).toHaveCount(1,15000)
      - expect(page.getByRole("button", "Activate or disable")).toHaveAttribute("aria-pressed","true",15000)
      - expect(page.locator("button.bp6-intent-success[aria-label='Activate or disable']")).toHaveText("On",15000)
      - page.getByRole("button", "Activate or disable").click()
      - expect(page.locator("button.bp6-intent-danger[aria-label='Activate or disable']")).toHaveText("Off",15000)
      - expect(page.getByRole("button", "Activate or disable")).toHaveAttribute("aria-pressed","false",15000)
      - page.getByRole("button", "Activate or disable").click()
      - expect(page.locator("button.bp6-intent-success[aria-label='Activate or disable']")).toHaveText("On",15000)
  savedLists:
    action: dsunit:query
    datastore: studio
    SQL: >-
      SELECT status,last_test_status,
      json_extract(options_json,'$.discovery.catalogs[0]') AS catalog,
      json_extract(options_json,'$.discovery.schemas[0].name') AS schema_name
      FROM connectors WHERE name='discovery_scoped'
    expect:
      - {status: active, last_test_status: passed, catalog: local, schema_name: lookup}
  scopedColumns:
    action: mcp/runner:call
    url: $nativeMCP
    bearerTokenSecret: $ownerToken
    '@name': studio.sdk.connectors.table
    arguments: {name: discovery_scoped, input: {catalog: local, schema: lookup, table: discovery_items}}
  columnBoundary:
    action: validator:assert
    actual: $scopedColumns.StructuredContent
    expect:
      table: {schema: lookup, name: discovery_items}
      '@length@columns': 2
      columns:
        - {name: dataset_marker}
        - {name: id}
  sqlNamespace:
    action: mcp/runner:call
    url: $nativeMCP
    bearerTokenSecret: $ownerToken
    '@name': studio.sdk.namespaces.create
    arguments: {name: explorer.sql, title: Explorer SQL, visibility: private}
  sqlWindowCreatesComponent:
    action: webdriver:run
    sessionID: localhost:4446
    autoStart: false
    browser: chrome
    failureArtifacts: {directory: '${runDir}/artifacts/explorer-sql'}
    commands:
      - page.goto("${browserURL}/e2e/login")
      - page.getByLabel("Test identity").selectOption("owner")
      - page.getByRole("button", "Sign in").click()
      - page.getByLabel("Current namespace").selectOption("${sqlNamespace.StructuredContent.namespaceId}")
      - page.locator("xpath://aside[contains(@class,'studio-sidebar')]//button[normalize-space(.)='Explorer']").click()
      - page.getByRole("button", "Open SQL window").click()
      - page.locator(".studio-explorer-sql-dialog [contenteditable='true']").fill("SELECT id, dataset_marker FROM lookup.discovery_items")
      - page.getByRole("button", "Run SQL").click()
      - expect(page.locator("xpath://div[contains(@class,'studio-explorer-sql-dialog')]//td[normalize-space(.)='lookup']")).toBeVisible(20000)
      - page.getByRole("button", "Create component").click()
      - expect(page.locator(".studio-explorer-sql-dialog")).toHaveCount(0,15000)
      - page.getByLabel("Component title").fill("Explorer SQL component")
      - page.getByLabel("Slug").fill("explorer-sql")
      - page.getByLabel("Root view identifier").fill("items")
      - page.getByRole("button", "Create component").click()
      - expect(page.getByRole("heading", "Component graph")).toBeVisible(20000)
  sqlComponentPersisted:
    action: dsunit:query
    datastore: studio
    SQL: >-
      SELECT c.title,c.default_connector_name,v.version_no,
      CASE WHEN v.authored_dql LIKE '%SELECT id, dataset_marker FROM lookup.discovery_items%' THEN 1 ELSE 0 END AS sql_preserved
      FROM components c JOIN component_versions v ON v.report_id=c.id
      WHERE c.slug='explorer-sql'
    expect:
      - {title: Explorer SQL component, default_connector_name: discovery_scoped, version_no: 1, sql_preserved: 1}
