window:
  windowKey: namespaces
  view:
    content:
      id: namespaces
      kind: table
      title: Namespaces
      dataSourceRef: namespaces
      table:
        columns:
          - id: title
            name: Title
          - id: name
            name: Namespace
          - id: status
            name: Status
          - id: visibility
            name: Visibility
          - id: mcpEnabled
            name: MCP enabled
dataSource:
  id: namespaces
  title: Studio namespaces
  cardinality: collection
  selectors:
    data: items
  uniqueKey:
    - field: namespaceId
  paging:
    enabled: true
    openEnded: true
    size: 25
    parameters:
      page: offset
      size: limit
  backend:
    kind: mcp_tool
    method: studio.sdk.namespaces.list
  cache:
    enabled: false
