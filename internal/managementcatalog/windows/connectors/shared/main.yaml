window:
  windowKey: connectors
  schemas:
    connectorIdentity:
      type: object
      required: [name, etag]
      additionalProperties: false
      properties:
        name: {type: string}
        etag: {type: integer}
  resourceModels:
    connectorIdentity:
      schemaRef: connectorIdentity
      write: {mode: full}
      fields:
        name: {read: name, write: name}
        etag: {read: etag, write: etag}
  view:
    content:
      id: connector-management
      className: studio-workspace
      containers:
        - id: connector-header
          workspaceSummary:
            title: Connectors
            description: Validate and manage data sources used by Studio readers.
            stateDataSourceRef: connector_draft
            errorField: outcome
            actions:
              - {id: refresh-catalog, label: Refresh, icon: refresh, handler: management.refreshConnectors}
        - id: connector-search
          className: forge-catalog-search
          dataSourceRef: connector_filter
          items:
            - {id: query, label: "Find connector, driver, or owner", hideLabel: true, properties: {placeholder: "Find connector, driver, or owner"}, dataField: query, type: text}
            - id: status
              label: Status
              hideLabel: true
              dataField: status
              type: select
              options: [{value: '', label: All states}, {value: active, label: Active}, {value: draft, label: Draft}, {value: disabled, label: Disabled}]
            - {id: search, label: Search, isStandalone: true, icon: search, type: button, on: [{event: onClick, handler: management.searchConnectors}]}
            - {id: new, label: New connector, isStandalone: true, type: button, icon: add, intent: primary, on: [{event: onClick, handler: management.newConnector}]}
        - id: connector-list
          kind: table
          title: Connectors
          dataSourceRef: connectors
          table:
            presentation: catalog
            fullWidth: true
            enforceColumnSize: false
            columns:
              - {id: name, name: Name, sortable: true, showFullContent: false}
              - {id: driver, name: Driver, sortable: true}
              - id: status
                name: Status
                badge: {field: status, replaceValue: true, valueMap: {active: active, draft: draft, disabled: disabled}, toneMap: {active: positive, draft: warning, disabled: neutral}}
              - {id: ownerId, name: Owner}
              - id: lastTestStatus
                name: Connectivity
                badge: {field: lastTestStatus, replaceValue: true, valueMap: {passed: passed, failed: failed}, toneMap: {passed: positive, failed: danger}}
              - {id: test, name: '', type: button, icon: refresh, tooltip: Test, width: 36, cellProperties: {aria-label: Test}, on: [{event: onClick, handler: management.testConnector}]}
              - {id: edit, name: '', type: button, icon: edit, tooltip: Edit, width: 36, cellProperties: {aria-label: Edit}, on: [{event: onClick, handler: management.editConnector}]}
              - {id: toggle, name: Connection, type: button, icon: power, pressedWhenValue: active, tooltip: Activate or disable, width: 100, cellProperties: {aria-label: Activate or disable}, on: [{event: onValue, handler: management.connectorStatus}, {event: onProperties, handler: management.connectorState}, {event: onClick, handler: management.toggleConnector}]}
              - {id: delete, name: '', type: button, icon: trash, tooltip: Delete, width: 36, cellProperties: {aria-label: Delete, intent: danger}, on: [{event: onClick, handler: management.confirmDeleteConnector}]}
  dialogs:
    - id: connector-delete
      title: Delete connector
      dataSourceRef: connector_draft
      fetchOnOpen: false
      content:
        id: connector-delete-confirmation
        items:
          - {id: name, label: Connector to delete, dataField: name, type: text, readOnly: true}
          - {id: outcome, label: Outcome, dataField: outcome, type: textarea, readOnly: true}
      actions:
        - {id: delete, label: Delete connector, close: true, on: [{event: onClick, handler: management.deleteConnector}]}
        - {id: cancel, label: Cancel, close: true}
    - id: connector-editor
      title: Connector configuration
      className: studio-connector-dialog
      dataSourceRef: connector_draft
      fetchOnOpen: false
      content:
        id: connector-form
        items:
          - {id: outcome, label: Outcome, dataField: outcome, type: textarea, readOnly: true}
          - {id: name, label: Name, dataField: name, type: text, readOnlyWhen: {selector: editing, when: true}}
          - id: driver
            label: Driver
            dataField: driver
            type: select
            options: [{value: mysql, label: MySQL}, {value: sqlite, label: SQLite}, {value: postgres, label: PostgreSQL}, {value: bigquery, label: BigQuery}, {value: oracle, label: Oracle}]
          - id: catalogRows
            label: Projects / catalogs
            widget: arrayFields
            scope: form
            dataField: catalogRows
            properties:
              addLabel: Add project / catalog
              removeLabel: Remove project / catalog
              newRow: {name: ''}
              fields:
                - {field: name, label: Project / catalog, type: text}
          - id: schemaRows
            label: Schemas / datasets
            widget: arrayFields
            scope: form
            dataField: schemaRows
            properties:
              addLabel: Add schema / dataset
              removeLabel: Remove schema / dataset
              newRow: {catalog: '', name: ''}
              fields:
                - {field: catalog, label: Project / catalog (optional), type: text}
                - {field: name, label: Schema / dataset, type: text}
          - {id: description, label: Description, dataField: description, type: textarea}
          - {id: secretRefDisplay, label: Secret reference, dataField: secretRefDisplay, type: text}
          - {id: dsnTemplate, label: DSN, dataField: dsnTemplate, type: textarea}
          - {id: secretURL, label: Secret URL, dataField: secretURL, type: text}
          - {id: secretKey, label: Secret key, dataField: secretKey, type: text}
          - {id: clearSecret, label: Remove secret, dataField: clearSecret, type: checkbox}
          - {id: options, label: Options (JSON), dataField: options, type: textarea}
          - {id: yamlText, label: YAML configuration (Driver / DSN / Secret.URL / Secret.Key), dataField: yamlText, type: textarea}
      actions:
        - {id: yaml, label: Apply YAML, on: [{event: onClick, handler: management.applyYAML}]}
        - {id: reload, label: Reload saved revision, on: [{event: onClick, handler: management.reloadConnector}]}
        - {id: test, label: Save & test, icon: refresh, on: [{event: onClick, handler: management.saveAndTestConnector}]}
        - {id: save, label: Save, close: true, on: [{event: onClick, handler: management.saveConnector}]}
        - {id: cancel, label: Cancel, close: true}
dataSources:
  connector_filter:
    id: connector_filter
    cardinality: object
    backend: {kind: inline, rows: []}
    cache: {enabled: false}
  connectors:
    id: connectors
    cardinality: collection
    selectionMode: single
    selectors: {data: items}
    uniqueKey: [{field: name}]
    paging: {enabled: true, openEnded: true, size: 25, parameters: {page: offset, size: limit}}
    backend: {kind: mcp_tool, method: studio.sdk.connectors.list}
    cache: {enabled: false}
  connector_draft:
    id: connector_draft
    cardinality: object
    backend: {kind: inline, rows: []}
    cache: {enabled: false}
