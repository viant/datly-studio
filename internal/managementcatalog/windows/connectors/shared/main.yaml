window:
  windowKey: connectors
  schemas:
    connectorIdentity:
      type: object
      required: [name, etag]
      additionalProperties: false
      properties:
        name: {type: string}
        etag: {type: integer}
  resourceModels:
    connectorIdentity:
      schemaRef: connectorIdentity
      write: {mode: full}
      fields:
        name: {read: name, write: name}
        etag: {read: etag, write: etag}
  view:
    content:
      id: connector-management
      className: studio-workspace
      containers:
        - id: connector-search
          dataSourceRef: connector_filter
          items:
            - {id: query, label: "Find connector, driver, or owner", dataField: query, type: text}
            - id: status
              label: Status
              dataField: status
              type: select
              options: [{value: '', label: All states}, {value: active, label: Active}, {value: draft, label: Draft}, {value: disabled, label: Disabled}]
            - {id: search, label: Search, type: button, on: [{event: onClick, handler: management.searchConnectors}]}
        - id: connector-list
          kind: table
          title: Connectors
          dataSourceRef: connectors
          toolbar:
            items:
              - {id: new, label: New connector, icon: add, on: [{event: onClick, handler: management.newConnector}]}
              - {id: edit, label: Edit, icon: edit, on: [{event: onClick, handler: management.editConnector}]}
              - {id: test, label: Test, icon: pulse, on: [{event: onClick, handler: management.testConnector}]}
              - {id: delete, label: Delete, icon: trash, on: [{event: onClick, handler: management.confirmDeleteConnector}]}
              - {id: refresh, label: Refresh, icon: refresh}
          editableCollection:
            identityFields: [name]
            selection: {min: 1, max: 1}
            operations:
              - id: activate
                label: Activate
                icon: tick
                requiresSelection: true
                mutation:
                  commandId: connector-activate
                  dataSourceRef: connector_activate
                  payload:
                    modelRef: connectorIdentity
                    target: '$'
                    mode: full
                    fields:
                      name: {scope: selection, dataSourceRef: connectors, selector: selected.name}
                      etag: {scope: selection, dataSourceRef: connectors, selector: selected.etag}
                  refresh: [{dataSourceRef: connectors, bypassCache: true}]
              - id: disable
                label: Disable
                icon: power
                requiresSelection: true
                mutation:
                  commandId: connector-disable
                  dataSourceRef: connector_disable
                  payload:
                    modelRef: connectorIdentity
                    target: '$'
                    mode: full
                    fields:
                      name: {scope: selection, dataSourceRef: connectors, selector: selected.name}
                      etag: {scope: selection, dataSourceRef: connectors, selector: selected.etag}
                  refresh: [{dataSourceRef: connectors, bypassCache: true}]
          table:
            columns:
              - {id: name, name: Name}
              - {id: driver, name: Driver}
              - {id: ownerId, name: Owner}
              - {id: status, name: Status}
              - {id: lastTestStatus, name: Last test}
        - id: connector-outcome
          dataSourceRef: connector_draft
          items:
            - {id: outcome, label: Outcome, dataField: outcome, type: textarea, readOnly: true}
  dialogs:
    - id: connector-delete
      title: Delete connector
      dataSourceRef: connector_draft
      fetchOnOpen: false
      content:
        id: connector-delete-confirmation
        items:
          - {id: name, label: Connector to delete, dataField: name, type: text, readOnly: true}
          - {id: outcome, label: Outcome, dataField: outcome, type: textarea, readOnly: true}
      actions:
        - {id: delete, label: Delete connector, close: true, on: [{event: onClick, handler: management.deleteConnector}]}
        - {id: cancel, label: Cancel, close: true}
    - id: connector-editor
      title: Connector configuration
      className: studio-connector-dialog
      dataSourceRef: connector_draft
      fetchOnOpen: false
      content:
        id: connector-form
        items:
          - {id: name, label: Name, dataField: name, type: text, readOnlyWhen: {selector: editing, when: true}}
          - id: driver
            label: Driver
            dataField: driver
            type: select
            options: [{value: mysql, label: MySQL}, {value: sqlite, label: SQLite}, {value: postgres, label: PostgreSQL}, {value: bigquery, label: BigQuery}, {value: oracle, label: Oracle}]
          - {id: description, label: Description, dataField: description, type: textarea}
          - {id: dsnDisplay, label: Saved DSN, dataField: dsnDisplay, type: textarea, readOnly: true}
          - {id: secretRefDisplay, label: Saved secret reference, dataField: secretRefDisplay, type: text, readOnly: true}
          - {id: dsnTemplate, label: DSN (blank keeps existing), dataField: dsnTemplate, type: textarea}
          - {id: secretURL, label: Secret URL, dataField: secretURL, type: text}
          - {id: secretKey, label: Secret key, dataField: secretKey, type: text}
          - {id: clearSecret, label: Remove secret, dataField: clearSecret, type: checkbox}
          - {id: options, label: Options (JSON), dataField: options, type: textarea}
          - {id: yamlText, label: YAML configuration (Driver / DSN / Secret.URL / Secret.Key), dataField: yamlText, type: textarea}
          - {id: outcome, label: Outcome, dataField: outcome, type: textarea, readOnly: true}
      actions:
        - {id: yaml, label: Apply YAML, on: [{event: onClick, handler: management.applyYAML}]}
        - {id: reload, label: Reload saved revision, on: [{event: onClick, handler: management.reloadConnector}]}
        - {id: save, label: Save, close: true, on: [{event: onClick, handler: management.saveConnector}]}
        - {id: cancel, label: Cancel, close: true}
dataSources:
  connector_filter:
    id: connector_filter
    cardinality: object
    backend: {kind: inline, rows: []}
    cache: {enabled: false}
  connectors:
    id: connectors
    cardinality: collection
    selectionMode: single
    selectors: {data: items}
    uniqueKey: [{field: name}]
    paging: {enabled: true, openEnded: true, size: 25, parameters: {page: offset, size: limit}}
    backend: {kind: mcp_tool, method: studio.sdk.connectors.list}
    cache: {enabled: false}
  connector_draft:
    id: connector_draft
    cardinality: object
    backend: {kind: inline, rows: []}
    cache: {enabled: false}
