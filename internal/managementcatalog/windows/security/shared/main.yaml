    cardinality: object
    backend:
      kind: inline
      rows: []
    cache:
      enabled: false
  security_identity:
    id: security_identity
    cardinality: object
    backend:
      kind: inline
      rows: []
    cache:
      enabled: false
  security_predicate_filter:
    id: security_predicate_filter
    cardinality: object
    backend:
      kind: inline
      rows: []
    cache:
      enabled: false
