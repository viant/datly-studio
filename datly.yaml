BaseDir: .
Endpoint:
  # Linked Studio control-plane components only. Dynamic readers run separately.
  Address: 127.0.0.1:8081
CORS:
  # Direct browser SDK calls use Bearer ID tokens, never cookies.
  AllowOrigins: [https://studio.example.com]
  AllowMethods: [GET, POST, OPTIONS]
  AllowHeaders: [Content-Type, Authorization, X-Studio-Namespace]
  AllowCredentials: false
MCP:
  # SDK tools are served separately from dynamic reader MCP on 8091.
  Address: 127.0.0.1:8090
  Authorization:
    Global:
      ProtectedResourceMetadata:
        Resource: http://127.0.0.1:8090/mcp
Connector: studio
Connectors:
  - Name: studio
    Driver: sqlite
    DSN: file:.data/studio.db?cache=shared
  - Name: authz
    # Reused authz writers participate in Studio's managed transaction.
    AliasOf: studio
JWTValidator:
  CertURL: https://idp.viantinc.com/v1/api/oauth2/certs
JWTClaims:
  Issuer: https://idp.viantinc.com
  Audience: datly-studio-web
  RequireSubject: true
GoBootstrap:
  # Instance startup reflects linked component, predicate, codec, and resource
  # types only. AST/DQL source discovery remains a transcribe-time concern.
  EagerComponents: true
  Packages:
    - github.com/viant/datly-studio/studio/authorization
    - github.com/viant/datly-studio/studio/authorization_predicates/types
